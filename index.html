 return `<section class="card"><div class="card-h"><h3>${icon('users')} ${_('ญาติที่เข้าถึงข้อมูลของคุณ','Family members with access')}</h3><button class="btn primary" data-a="invite">${icon('plus')} ${_('เพิ่มญาติ','Add family member')}</button></div>
 <ul class="clist"><li>${icon('check')}<span>${_('ญาติต้องได้รับอนุญาตจากคุณก่อนเข้าถึงข้อมูล','Family members see nothing until you allow it')}</span></li><li>${icon('check')}<span>${_('คุณกำหนดได้ว่าญาติแต่ละคนดูข้อมูลอะไรได้บ้าง และเปลี่ยนได้ทุกเมื่อ','You choose what each person sees and can change it any time')}</span></li><li>${icon('check')}<span>${_('อาการเตือนฉุกเฉินแสดงให้ญาติทุกคนเห็นเสมอ','Emergency warning signs are always visible to family')}</span></li></ul></section>
 ${list.length?list.map(c=>{const cg=C(c.caregiverId);return `<section class="card"><div class="card-h"><div class="row"><div class="avatar">${initial(cg)}</div><div><h3>${esc(L(cg.name))}</h3><p class="muted">${esc(L(c.relation))} · <span class="num">${esc(cg.phone)}</span></p></div></div>${c.active?chip('ok',_('เข้าถึงได้','Active')):chip('',_('เพิกถอนแล้ว','Revoked'))}</div>
  <div>${PERMS.map(([k,l])=>`<label class="sw"><span>${esc(L(l))}</span><input type="checkbox" data-c="perm" data-cs="${c.id}" data-k="${k}" id="perm-${c.id}-${k}" ${c.perms[k]?'checked':''} ${c.active?'':'disabled'}></label>`).join('')}</div>
  <div class="row">${c.active?`<button class="btn sm ghost" data-a="revoke" data-cs="${c.id}">${icon('lock')} ${_('เพิกถอนสิทธิ์ทั้งหมด','Revoke all access')}</button>`:`<button class="btn sm" data-a="restore" data-cs="${c.id}">${_('ให้สิทธิ์อีกครั้ง','Restore access')}</button>`}<span class="hint">${_('อนุญาตตั้งแต่','Since')} ${fmtDate(c.since)}</span></div></section>`}).join(''):emptyCard('users',_('ยังไม่มีญาติที่เชื่อมโยง','No family members yet'))}`;
}
function familyReadonly(pid){const list=D.consents.filter(c=>c.patientId===pid);return `<section class="card"><div class="card-h"><h3>${icon('users')} ${_('ญาติที่ผู้ป่วยอนุญาต','Family the patient has authorised')}</h3>${chip('',icon('lock')+_('ผู้ป่วยเป็นผู้จัดการสิทธิ์','Managed by the patient'))}</div>
 ${list.length?list.map(c=>{const cg=C(c.caregiverId);return `<div class="qrow"><div><b>${esc(L(cg.name))}</b><span class="muted">${esc(L(c.relation))} · <span class="num">${esc(cg.phone)}</span></span><div class="row">${PERMS.map(([k,l])=>c.perms[k]?chip('ok',esc(L(l))):'').join('')}</div></div>${c.active?chip('ok',_('เข้าถึงได้','Active')):chip('',_('เพิกถอนแล้ว','Revoked'))}</div>`}).join(''):`<p class="muted">${_('ผู้ป่วยยังไม่ได้เพิ่มญาติ','No family members added')}</p>`}
 <p class="hint">${_('บุคลากรดูรายการนี้ได้ตามนโยบายของโรงพยาบาล การเปลี่ยนสิทธิ์ทำโดยผู้ป่วย','Staff can view this list per hospital policy. Only the patient changes access.')}</p></section>`}

/* ---------- learn ---------- */
const artBtn=a=>`<button class="art" data-a="artopen" data-id="${a.id}"><span>${icon('book')}<span>${esc(L(a.title))}</span></span>${a.reviewed?'':chip('gold',_('ฉบับร่าง','Draft'))}${icon('chev')}</button>`;
const chBtn=({v,c})=>`<button class="art vid" data-a="vidopen" data-v="${v.id}" data-t="${c[0]}"><span>${icon('play')}<span>${esc(L(c[2]))}</span></span><span class="muted num">${_('วิดีโอ','Video')} ${mmss(c[0])}</span></button>`;
function recoCard(pid){const ph=P(pid).phase;const tids=TOPICS.filter(t=>t.ph===ph).map(t=>t.id);const arts=D.education.filter(a=>tids.includes(a.topic)).slice(0,3);const chs=tids.flatMap(chaptersFor).slice(0,2);if(!arts.length&&!chs.length)return'';
 return `<section class="card"><div class="card-h"><h3>${icon('book')} ${_('แนะนำสำหรับช่วงของคุณ','Suggested for your stage')}</h3><button class="btn sm ghost" data-a="go" data-v="learn">${_('ดูทั้งหมด','See all')}</button></div><div class="stack">${chs.map(chBtn).join('')}${arts.map(artBtn).join('')}</div></section>`}
/* ---------- mini quiz after each episode (2 questions; answers taken from that episode's script) ---------- */
const QZ={
 ep01:[['คะแนน MELD-Na ตั้งแต่เท่าไร ที่การปลูกถ่ายตับมักให้ประโยชน์มากกว่าความเสี่ยง','From what MELD-Na score does a transplant usually help more than it risks?',[['10 คะแนน','10'],['15 คะแนน','15'],['25 คะแนน','25']],1,'ตั้งแต่ 15 คะแนนขึ้นไป การปลูกถ่ายมักให้ประโยชน์มากกว่าความเสี่ยง','From 15 points up, a transplant usually helps more than it risks.'],
  ['มะเร็งเซลล์ตับที่อยู่ในเกณฑ์ Milan แบบมีก้อนเดียว ก้อนต้องไม่เกินกี่เซนติเมตร','Under the Milan criteria, how big can a single liver tumour be?',[['3 เซนติเมตร','3 cm'],['5 เซนติเมตร','5 cm'],['10 เซนติเมตร','10 cm']],1,'ก้อนเดียวไม่เกิน 5 ซม. หรือไม่เกิน 3 ก้อน ก้อนละไม่เกิน 3 ซม. และยังไม่ลุกลามออกนอกตับ','One tumour up to 5 cm, or up to 3 tumours of 3 cm each, not spread outside the liver.']],
 ep02:[['ต้องตรวจอุจจาระกี่วันติดกัน','How many days in a row is the stool tested?',[['1 วัน','1 day'],['3 วัน','3 days'],['7 วัน','7 days']],1,'ตรวจอุจจาระ 3 วันติดกัน ร่วมกับซักประวัติ ตรวจร่างกาย และตรวจเลือด','Stool is tested 3 days in a row, along with history, exam and blood tests.'],
  ['ระหว่างรอปลูกถ่าย ทีมจะนัดติดตามทุกกี่สัปดาห์','While waiting, how often are follow-up visits?',[['ทุก 1–2 สัปดาห์','Every 1–2 weeks'],['ทุก 6–8 สัปดาห์','Every 6–8 weeks'],['ปีละครั้ง','Once a year']],1,'เมื่อขึ้นทะเบียนแล้ว ระหว่างรอจะนัดติดตามทุก 6–8 สัปดาห์','After listing, follow-up is every 6–8 weeks.']],
 ep03:[['วัคซีนชนิดใด ห้ามฉีดหลังปลูกถ่าย','Which vaccines must not be given after transplant?',[['วัคซีนชนิดเชื้อตาย เช่น ไข้หวัดใหญ่','Inactivated, e.g. flu'],['วัคซีนชนิดเชื้อเป็น','Live vaccines'],['วัคซีนโควิด-19','COVID-19']],1,'วัคซีนเชื้อเป็นห้ามฉีดหลังปลูกถ่าย ส่วนวัคซีนเชื้อตายฉีดได้ทั้งก่อนและหลัง','Live vaccines are not given after transplant; inactivated ones can be given before and after.'],
  ['หลังปลูกถ่าย ต้องรออย่างน้อยนานเท่าไร จึงเริ่มฉีดวัคซีนได้','After transplant, how long before vaccines can start?',[['1 เดือน','1 month'],['3 เดือน','3 months'],['1 ปี','1 year']],1,'ต้องรออย่างน้อย 3 เดือน และถามทีมปลูกถ่ายก่อนฉีดทุกครั้ง','Wait at least 3 months, and always ask the transplant team first.']],
 ep04:[['ควรทำฟันให้เสร็จก่อนผ่าตัดอย่างน้อยนานเท่าไร','How long before surgery should dental work be finished?',[['1 วันก่อนผ่าตัด','1 day before'],['2–4 สัปดาห์ก่อนผ่าตัด','2–4 weeks before'],['ทำหลังผ่าตัดก็ได้','After surgery is fine']],1,'ทำให้เสร็จอย่างน้อย 2–4 สัปดาห์ก่อนผ่าตัด เพื่อให้แผลในปากหายสนิท','Finish 2–4 weeks before surgery so the mouth heals fully.'],
  ['ยาแก้ปวดกลุ่มใด โดยทั่วไปห้ามใช้ในผู้ป่วยตับแข็ง','Which painkillers are generally not used in cirrhosis?',[['ยากลุ่มเอ็นเสด (NSAIDs)','NSAIDs'],['ยาที่แพทย์สั่ง','Prescribed medicines'],['น้ำยาบ้วนปาก','Mouthwash']],0,'ยากลุ่มเอ็นเสดโดยทั่วไปห้ามใช้ในผู้ป่วยตับแข็ง อย่าซื้อยาแก้ปวดกินเอง','NSAIDs are generally avoided in cirrhosis. Don’t buy painkillers yourself.']],
 ep05:[['ถ้ามีท้องมานหรือบวม ควรจำกัดเกลือไม่เกินประมาณเท่าไรต่อวัน','With ascites or swelling, about how much salt a day at most?',[['1 ช้อนชา','1 teaspoon'],['1 ช้อนโต๊ะ','1 tablespoon'],['ไม่ต้องจำกัด','No limit']],0,'จำกัดเกลือไม่เกินประมาณ 1 ช้อนชาต่อวัน','About 1 teaspoon a day at most.'],
  ['อาหารใด ควรงดระหว่างรอปลูกถ่าย','Which food should you avoid while waiting?',[['ปลานึ่งสุก','Steamed fish'],['ลาบดิบ ก้อย','Raw minced meat salads'],['เต้าหู้','Tofu']],1,'งดอาหารดิบหรือกึ่งสุกกึ่งดิบ เช่น ลาบดิบ ก้อย ปลาดิบ หอยดิบ และไข่ดิบ','Avoid raw or undercooked food such as raw larb, koi, raw fish, shellfish and eggs.']],
 ep06:[['เดินออกกำลังครั้งละประมาณกี่นาที','About how long should each walk be?',[['2–3 นาที','2–3 minutes'],['10–15 นาที','10–15 minutes'],['1 ชั่วโมงขึ้นไป','Over an hour']],1,'เดินครั้งละ 10–15 นาที ให้เหนื่อยปานกลาง ประมาณ 3–6 จากเต็ม 10','Walk 10–15 minutes at moderate effort, about 3–6 out of 10.'],
  ['ลุกจากเตียงแบบใด ช่วยลดการดึงแผลหน้าท้อง','How should you get out of bed to protect the wound?',[['ลุกนั่งตรง ๆ ทันที','Sit straight up'],['ตะแคงตัวก่อน แล้วดันตัวขึ้นนั่ง','Roll to your side, then push up'],['ให้คนดึงแขนขึ้น','Have someone pull your arms']],1,'ตะแคงตัวก่อน แล้วดันตัวขึ้นนั่ง ช่วยลดการดึงแผลหน้าท้อง','Roll onto your side first, then push up to sit.']],
 ep07:[['ผู้ที่เคยดื่มสุรา ต้องหยุดดื่มเด็ดขาดอย่างน้อยนานเท่าไร','People who drank alcohol must stop completely for at least how long?',[['1 เดือน','1 month'],['6 เดือน','6 months'],['ไม่ต้องหยุด','No need to stop']],1,'ต้องหยุดดื่มเด็ดขาดอย่างน้อย 6 เดือน และผ่านการประเมินจากจิตแพทย์','At least 6 months without alcohol, plus a psychiatric assessment.'],
  ['การประเมินด้านจิตใจก่อนขึ้นทะเบียน มีไว้เพื่ออะไร','What is the mental-health assessment for?',[['ตัดสิทธิ์ผู้ที่มีความกังวล','To rule out worried patients'],['ช่วยหาทางแก้ร่วมกัน และดูแลต่อเนื่อง','To work things out together and keep supporting you'],['ไม่มีความจำเป็น','It isn’t needed']],1,'ไม่ใช่การตัดสิทธิ์ ทีมจะช่วยหาทางแก้ร่วมกับคุณ และดูแลต่อเนื่องจนหลังผ่าตัด','It isn’t to exclude you. The team works with you and keeps supporting you after surgery.']],
 ep08:[['ควรเตรียมผู้ดูแลแบบใด','What kind of caregiver set-up is best?',[['ผู้ดูแลหลักคนเดียวก็พอ','One main caregiver only'],['มีทั้งผู้ดูแลหลักและผู้ดูแลสำรอง','A main and a back-up caregiver'],['ไม่ต้องมีผู้ดูแล','No caregiver']],1,'ควรมีผู้ดูแลสำรอง เผื่อวันที่ผู้ดูแลหลักไม่ว่าง','Have a back-up in case the main caregiver is unavailable.'],
  ['ถ้ากังวลเรื่องค่าใช้จ่าย ควรทำอย่างไร','Worried about costs? What should you do?',[['รอจนผ่าตัดเสร็จ','Wait until after surgery'],['บอกนักสังคมสงเคราะห์ตั้งแต่เนิ่น ๆ','Tell the social worker early'],['ไม่ต้องบอกใคร','Tell no one']],1,'บอกนักสังคมสงเคราะห์ได้ตั้งแต่เนิ่น ๆ เพื่อช่วยประสานความช่วยเหลือ','Tell the social worker early so they can arrange help.']],
 ep09:[['อาเจียนเป็นเลือด หรือถ่ายดำ ควรทำอย่างไร','Vomiting blood or black stools: what should you do?',[['บันทึกในแอปแล้วรอ','Log it in the app and wait'],['ไปห้องฉุกเฉินหรือโทร 1669 ทันที','Go to emergency or call 1669 now'],['รอนัดครั้งถัดไป','Wait for the next visit']],1,'อาการรุนแรงต้องไปห้องฉุกเฉินหรือโทร 1669 ทันที อย่ารอการตอบกลับผ่านแอป','Go to emergency or call 1669 at once. Don’t wait for a reply in the app.'],
  ['สับสน ง่วงซึม หรือพฤติกรรมเปลี่ยน อาจเป็นภาวะใด','Confusion, drowsiness or behaviour change may be…',[['ภาวะสมองจากโรคตับ','Liver-related brain changes'],['อาการปกติจากการพักผ่อนน้อย','Just tiredness'],['ภาวะขาดวิตามิน','A vitamin shortage']],0,'อาจเป็นภาวะสมองจากโรคตับ ให้แจ้งทีมรักษา','It may be hepatic encephalopathy. Tell the care team.']],
 ep10:[['หลังผ่าตัด จะได้พักที่ไหนก่อน','Where do you go first after surgery?',[['หอผู้ป่วยวิกฤต (ไอซียู)','The intensive care unit (ICU)'],['กลับบ้านทันที','Straight home'],['ห้องตรวจผู้ป่วยนอก','The outpatient clinic']],0,'หลังผ่าตัดจะพักในไอซียู เพื่อให้ทีมดูแลอย่างใกล้ชิด','You stay in the ICU so the team can watch you closely.'],
  ['ถ้าเจ็บแผล ควรบอกพยาบาลอย่างไร','If the wound hurts, how do you tell the nurse?',[['อดทนไว้ ไม่ต้องบอก','Put up with it'],['ให้คะแนนความปวด 0 ถึง 10','Rate the pain from 0 to 10'],['ขอยาจากญาติ','Ask family for medicine']],1,'บอกพยาบาลโดยให้คะแนนความปวด 0–10 ทีมจะช่วยจัดการความปวดให้','Rate your pain 0–10 and the team will manage it.']],
 ep11:[['นักกายภาพบำบัดจะเริ่มฟื้นฟูเมื่อไร','When does physiotherapy start?',[['เมื่อกลับถึงบ้าน','Once you are home'],['ทันทีที่สัญญาณชีพคงที่ แม้ยังอยู่ไอซียู','As soon as vital signs are stable, even in ICU'],['1 เดือนหลังผ่าตัด','A month after surgery']],1,'เริ่มฟื้นฟูทันทีที่สัญญาณชีพคงที่ แม้ยังอยู่ในไอซียู','Rehab starts as soon as vital signs are stable, even in the ICU.'],
  ['เวลาไอ ทำอย่างไรเพื่อลดการเจ็บแผล','How can you ease wound pain when coughing?',[['กลั้นไอไว้','Hold the cough in'],['กอดหมอนกดแผลเบา ๆ','Hug a pillow gently over the wound'],['นอนราบนิ่ง ๆ','Lie flat and still']],1,'กอดหมอนกดแผลเบา ๆ เวลาไอ และฝึกไอขับเสมหะ','Hug a pillow over the wound when you cough.']],
 ep12:[['ใครต้องล้างมือ ก่อนสัมผัสผู้ป่วย','Who must clean their hands before touching the patient?',[['เฉพาะแพทย์','Only doctors'],['ทุกคนที่สัมผัสผู้ป่วย','Everyone who touches the patient'],['เฉพาะญาติ','Only family']],1,'ทุกคนต้องล้างมือหรือใช้เจลแอลกอฮอล์ก่อนเสมอ ผู้ป่วยถามเจ้าหน้าที่ได้','Everyone cleans their hands first, and patients may ask staff to.'],
  ['ญาติที่มีไข้ ไอ หรือเป็นหวัด ควรทำอย่างไร','What should a relative with a cold or fever do?',[['เยี่ยมได้ตามปกติ','Visit as usual'],['งดเยี่ยมก่อน','Postpone the visit'],['นำดอกไม้มาเยี่ยมแทน','Bring flowers instead']],1,'ควรงดเยี่ยมก่อน และใส่หน้ากากเมื่ออยู่ใกล้ผู้ป่วย ส่วนดอกไม้สดงดนำมาตามระเบียบ','Postpone the visit and wear a mask near the patient. Fresh flowers aren’t allowed.']],
 ep13:[['ก่อนกลับบ้าน ใครควรฝึกจำชื่อยา ขนาด และเวลากินยา','Before going home, who should learn the medicine names, doses and times?',[['ผู้ป่วยเท่านั้น','Only the patient'],['ทั้งผู้ป่วยและผู้ดูแล','Both patient and caregiver'],['พยาบาลเท่านั้น','Only the nurse']],1,'ทั้งผู้ป่วยและผู้ดูแลควรจำชื่อยา ขนาด และเวลากินยาแต่ละตัว','Both the patient and the caregiver should know them.'],
  ['ช่วงแรกหลังกลับบ้าน ต้องมาโรงพยาบาลบ่อยแค่ไหน','Early on after discharge, how often do you come back?',[['บ่อย ตามนัดตรวจและเจาะเลือด','Often, for check-ups and blood tests'],['ปีละครั้ง','Once a year'],['ไม่ต้องมาอีก','Not at all']],0,'ช่วงแรกต้องมาบ่อย รับใบนัดและนัดเจาะเลือดให้ครบก่อนกลับบ้าน','Often at first. Get your appointment and blood-test dates before leaving.']],
 'ep14-1':[['ทำไมต้องกินยากดภูมิคุ้มกัน','Why take immunosuppressants?',[['ป้องกันร่างกายปฏิเสธตับใหม่','To stop the body rejecting the new liver'],['ช่วยลดน้ำหนัก','To lose weight'],['รักษาอาการไข้','To treat fever']],0,'ยากดภูมิคุ้มกันช่วยป้องกันการปฏิเสธอวัยวะ (graft rejection)','They prevent graft rejection.'],
  ['ต้องกินยากดภูมิคุ้มกันชนิดรับประทานนานเท่าไร','How long do you take the oral medicines?',[['1 เดือน','1 month'],['1 ปี','1 year'],['ต่อเนื่องตลอดชีวิต','For life']],2,'หลังสัปดาห์แรก ยาชนิดรับประทานต้องกินต่อเนื่องไปตลอดชีวิต','After the first week, the oral medicines continue for life.']],
 'ep14-2':[['ยาโปรแกรฟ กินวันละกี่ครั้ง','How many times a day is Prograf taken?',[['วันละ 1 ครั้ง','Once a day'],['วันละ 2 ครั้ง ห่างกัน 12 ชั่วโมง','Twice a day, 12 hours apart'],['วันละ 3 ครั้ง','Three times a day']],1,'โปรแกรฟกินวันละ 2 ครั้ง เช้าและเย็น ห่างกันทุก 12 ชั่วโมง','Twice daily, morning and evening, 12 hours apart.'],
  ['ยาแอดวาแกรฟต่างจากโปรแกรฟอย่างไร','How is Advagraf different from Prograf?',[['ปล่อยยาช้า ๆ 24 ชั่วโมง จึงกินวันละ 1 ครั้ง','It releases slowly over 24 hours, so once a day'],['เป็นยาคนละกลุ่มกัน','It’s a different drug group'],['กินเฉพาะเวลาไม่สบาย','Only when unwell']],0,'แอดวาแกรฟเป็นยากลุ่มเดียวกัน แต่ปล่อยยาอย่างช้า ๆ ต่อเนื่อง 24 ชั่วโมง','Same group, but released slowly over 24 hours.']],
 'ep14-3':[['ยามายฟอร์ติกถูกออกแบบให้ปล่อยตัวยาที่ไหน','Where is Myfortic designed to release?',[['ในกระเพาะอาหาร','In the stomach'],['ในลำไส้เล็ก','In the small intestine'],['ในตับ','In the liver']],1,'ปล่อยยาในลำไส้เล็ก ช่วยลดผลข้างเคียงทางเดินอาหาร เช่น ปวดท้อง ท้องเสีย','In the small intestine, which reduces stomach side effects.'],
  ['ยามายฟอร์ติกที่โรงพยาบาลมีขนาดใดบ้าง','Which Myfortic strengths does the hospital have?',[['360 และ 180 มิลลิกรัม','360 mg and 180 mg'],['1 และ 0.5 มิลลิกรัม','1 mg and 0.5 mg'],['500 มิลลิกรัม','500 mg']],0,'มี 2 ขนาด คือ 360 และ 180 มิลลิกรัม กินตามขนาดที่แพทย์สั่ง','360 mg and 180 mg; take the dose your doctor prescribes.']],
 'ep14-4':[['ลืมยาโปรแกรฟมื้อ 6 โมงเช้า นึกได้ตอน 11 โมง ควรทำอย่างไร','Missed the 6 a.m. Prograf, remembered at 11 a.m. What now?',[['กินทันทีที่นึกได้','Take it now'],['รอมื้อเย็นแล้วกินเพิ่มเป็น 2 เท่า','Double the evening dose'],['ไม่กินทั้งวัน','Skip the whole day']],0,'ยังไม่เกิน 6 ชั่วโมง ให้กินทันที แล้วมื้อเย็นกินตามปกติ','Under 6 hours late: take it now, then the evening dose as usual.'],
  ['ถ้าลืมยาโปรแกรฟเกิน 6 ชั่วโมงแล้ว ควรทำอย่างไร','More than 6 hours late with Prograf?',[['กินทันที','Take it now'],['รอกินมื้อถัดไปตามปกติ ไม่เพิ่มขนาดยา','Wait for the next dose, without doubling'],['มื้อถัดไปกินเพิ่มเป็น 2 เท่า','Double the next dose']],1,'เกิน 6 ชั่วโมง ให้รอกินมื้อถัดไป ห้ามเพิ่มขนาดยาเพื่อชดเชย','Wait for the next dose. Never double up.']],
 'ep14-5':[['ลืมยาแอดวาแกรฟ ถ้ายังไม่เกินกี่ชั่วโมง ให้กินทันที','Advagraf: up to how many hours late can you still take it?',[['6 ชั่วโมง','6 hours'],['12 ชั่วโมง','12 hours'],['24 ชั่วโมง','24 hours']],1,'ไม่เกิน 12 ชั่วโมงให้กินทันที เกิน 12 ชั่วโมงให้ข้ามไปมื้อของวันถัดไป','Up to 12 hours: take it. Later than that: wait for tomorrow’s dose.'],
  ['ยาโปรแกรฟและแอดวาแกรฟ ควรกินเวลาใด','When should Prograf and Advagraf be taken?',[['พร้อมอาหาร','With food'],['ก่อนอาหาร 1 ชม. หรือหลังอาหาร 1–2 ชม.','1 hour before or 1–2 hours after food'],['ก่อนนอนเท่านั้น','Only at bedtime']],1,'ยาดูดซึมได้ดีตอนท้องว่าง จึงกินก่อนอาหาร 1 ชั่วโมง หรือหลังอาหาร 1–2 ชั่วโมง','They absorb best on an empty stomach.']],
 'ep14-6':[['ผลไม้ใด ห้ามกินร่วมกับยากดภูมิคุ้มกัน','Which fruit must not be eaten with these medicines?',[['กล้วย','Banana'],['ส้มโอ','Pomelo'],['แอปเปิลปอกเปลือก','Peeled apple']],1,'ห้ามกินร่วมกับเกรปฟรุต ส้มเปลือกหนา ส้มแมนดาริน ส้มโอ และมะนาว รวมถึงน้ำผลไม้เหล่านี้','Avoid grapefruit, thick-skinned oranges, mandarins, pomelo and lime, and their juices.'],
  ['ข้อใดถูกต้อง เรื่องการกินยาแอดวาแกรฟ','Which is correct about Advagraf capsules?',[['แกะแคปซูลผสมน้ำได้','You can open the capsule'],['กลืนทั้งแคปซูล ห้ามแกะ','Swallow whole, never open'],['เก็บไว้ที่มีแดดส่อง','Keep it in the sun']],1,'กลืนยาทั้งแคปซูล ห้ามแกะ และเก็บยาให้พ้นแสงแดด ความร้อน และความชื้น','Swallow whole, and keep away from sun, heat and damp.']],
 ep15:[['ก่อนกินยาใหม่ทุกชนิด รวมถึงยาที่ซื้อเอง ควรทำอย่างไร','Before any new medicine, even over-the-counter?',[['ซื้อกินได้เลยถ้าเป็นยาสามัญ','Just take it if it’s common'],['ถามทีมปลูกถ่ายหรือเภสัชกรก่อน','Ask the transplant team or pharmacist first'],['กินครึ่งขนาดก่อน','Take half a dose first']],1,'ยาบางชนิดทำให้ระดับยากดภูมิสูงหรือต่ำเกินไป ต้องถามทีมก่อนทุกครั้ง','Some medicines push drug levels too high or too low.'],
  ['สมุนไพร ยาต้ม และอาหารเสริม กินได้หรือไม่','Herbs, herbal brews and supplements?',[['กินได้ เพราะเป็นของธรรมชาติ','Fine, they’re natural'],['ห้ามกินเองโดยไม่ปรึกษาทีม','Not without asking the team'],['กินได้ถ้าเพื่อนแนะนำ','Fine if a friend recommends']],1,'สมุนไพร ยาต้ม ยาลูกกลอน และอาหารเสริม ห้ามกินเองโดยไม่ปรึกษาทีม','Never take them without asking the team.']],
 ep16:[['ถ้าเลี้ยงสัตว์ ใครควรทำความสะอาดกรงหรือกระบะทราย','Who should clean pet cages or litter trays?',[['ผู้ป่วยทำเอง','The patient'],['ให้คนอื่นช่วยทำ','Someone else'],['ไม่ต้องทำความสะอาด','No one']],1,'ให้คนอื่นช่วยทำความสะอาด และล้างมือหลังสัมผัสสัตว์','Let someone else do it, and wash hands after touching pets.'],
  ['มีไข้ หนาวสั่น ไอ หรือเจ็บคอ ควรทำอย่างไร','Fever, chills, cough or sore throat?',[['กินยาลดไข้แล้วรอดูหลายวัน','Take paracetamol and wait days'],['แจ้งทีมรักษา','Tell the care team'],['อาบน้ำเย็นแล้วนอนพัก','Cold shower and rest']],1,'ให้แจ้งทีม อย่ากินยาลดไข้แล้วรอดูอาการเองนาน ๆ','Tell the team; don’t just take fever medicine and wait.']],
 ep17:[['ตัวเหลือง ตาเหลือง ปัสสาวะสีเข้ม อาจเป็นสัญญาณของอะไร','Yellow skin or eyes and dark urine may signal…',[['ตับมีปัญหา','A liver problem'],['ดื่มน้ำมากเกินไป','Too much water'],['อาการปกติหลังผ่าตัด','Normal recovery']],0,'อาจเป็นสัญญาณว่าตับมีปัญหา ให้แจ้งทีม','It may mean a liver problem. Tell the team.'],
  ['หายใจลำบาก หมดสติ หรือเลือดออกมาก ควรทำอย่างไร','Trouble breathing, fainting or heavy bleeding?',[['ประเมินในแอปแล้วรอทีมตอบ','Use the app and wait for a reply'],['ไปห้องฉุกเฉินหรือโทร 1669 ทันที','Go to emergency or call 1669 now'],['รอนัดครั้งถัดไป','Wait for the next visit']],1,'อาการรุนแรงให้ไปห้องฉุกเฉินหรือโทร 1669 ทันที อย่ารอการตอบกลับผ่านแอป','Go to emergency or call 1669 at once.']],
 ep18:[['ผลเลือดหลังปลูกถ่ายบอกอะไรได้บ้าง','What do the blood tests show?',[['การทำงานของตับ ไต เม็ดเลือด และระดับยากดภูมิ','Liver, kidney, blood counts and drug levels'],['น้ำหนักตัวเท่านั้น','Only weight'],['ไม่ได้บอกอะไร','Nothing']],0,'ผลเลือดบอกการทำงานของตับ ไต เม็ดเลือด และระดับยากดภูมิคุ้มกัน','Liver and kidney function, blood counts and drug levels.'],
  ['ผู้ที่กินยากดภูมิคุ้มกัน มีความเสี่ยงมะเร็งชนิดใดสูงขึ้น','Immunosuppressants raise the risk of which cancer?',[['มะเร็งผิวหนัง','Skin cancer'],['มะเร็งกระดูก','Bone cancer'],['ไม่มีความเสี่ยงเพิ่ม','No added risk']],0,'เสี่ยงมะเร็งผิวหนังสูงขึ้น ควรกันแดด และตรวจคัดกรองมะเร็งตามนัด','Skin cancer. Use sun protection and keep screening visits.']],
 ep19:[['หลังปลูกถ่าย ควรดื่มเครื่องดื่มแอลกอฮอล์อย่างไร','After transplant, what about alcohol?',[['ดื่มได้เล็กน้อย','A little is fine'],['งดตลอดชีวิต','None, for life'],['ดื่มได้หลัง 1 ปี','Fine after a year']],1,'งดเครื่องดื่มแอลกอฮอล์ตลอดชีวิต เพราะอาจทำลายตับใหม่ได้','No alcohol for life; it can damage the new liver.'],
  ['อยากกลับไปทำงาน ขับรถ หรือเดินทางไกล ควรทำอย่างไร','Want to return to work, drive or travel far?',[['ทำได้ทันทีที่กลับบ้าน','Straight away'],['ปรึกษาทีมก่อนว่าพร้อมเมื่อไร','Ask the team when you’re ready'],['ห้ามทำตลอดชีวิต','Never again']],1,'ปรึกษาทีมก่อน ว่าพร้อมเมื่อไร','Ask the team when you’ll be ready.']],
};
const quizDone={};

const qOrder=(vid,qi,n)=>{let h=0;for(const ch of vid+'#'+qi)h=(h*31+ch.charCodeAt(0))>>>0;const r=h%n;return Array.from({length:n},(_x,k)=>(k+r)%n)};
const qKey=vid=>`${S.user?.id}|${vid}`;
const nextVid=vid=>{const i=VIDEOS.findIndex(v=>v.id===vid);return VIDEOS[i+1]||null};
function quizView(v,q){const Q=QZ[v.id],n=Q.length;const TH=['ก','ข','ค','ง'];
 const head=`<div class="qz-h"><span class="qz-k">${icon('book')} ${_('แบบทดสอบท้ายตอน','End-of-episode quiz')} · ${_('ตอนที่','Ep.')} ${v.ep}</span><button class="vf-x static" data-a="close" aria-label="${_('ปิด','Close')}">${icon('x')}</button></div>`;
 if(q.i>=n){const sc=q.score,nv=nextVid(v.id);const msg=sc===n?_('เยี่ยมมาก! ตอบถูกทุกข้อ','Excellent! All correct'):sc>0?_('ดีมากค่ะ ทบทวนอีกนิดนะคะ','Well done. A quick review will help.'):_('ไม่เป็นไรค่ะ ลองดูวิดีโออีกครั้งนะคะ','No worries. Try watching again.');
  return `<div class="vfull qmode" role="dialog" aria-modal="true" aria-label="${_('ผลแบบทดสอบ','Quiz result')}"><div class="qz">${head}<div class="qz-res"><div class="qz-score ${sc===n?'full':''}"><b class="num">${sc}/${n}</b><small>${_('ข้อที่ถูก','correct')}</small></div><h2>${msg}</h2><p>${esc(L(v.title))}</p></div>
   <div class="qz-act">${nv?`<button class="qz-btn pri" data-a="qnextvid">${_('ดูตอนถัดไป','Next episode')}: ${_('ตอนที่','Ep.')} ${nv.ep} ${icon('chev')}</button>`:''}<button class="qz-btn" data-a="qreplay">${icon('play')} ${_('ดูวิดีโออีกครั้ง','Watch again')}</button><button class="qz-btn ghost" data-a="close">${_('กลับหน้าความรู้','Back to lessons')}</button></div></div></div>`}
 const [qt,qe,opts,ans,xt,xe]=Q[q.i];const done=q.pick!=null;
 const intro=q.pop&&q.i===0&&!done?`<div class="qz-pop">${icon('check')}<span><b>${_('ดูจบแล้ว เก่งมากค่ะ!','You finished the episode!')}</b><small>${_('ลองตอบคำถามสั้น ๆ','Try a quick quiz')} ${n} ${_('ข้อ','questions')}</small></span></div>`:'';
 return `<div class="vfull qmode" role="dialog" aria-modal="true" aria-label="${_('แบบทดสอบ','Quiz')}"><div class="qz ${q.pop&&q.i===0&&!done?'popin':''}">${head}${intro}
  <div class="qz-dots">${Q.map((_x,i)=>`<i class="${i<q.i?'d':i===q.i?'c':''}"></i>`).join('')}<span>${_('ข้อ','Question')} ${q.i+1}/${n}</span></div>
  <h2 class="qz-q">${_(qt,qe)}</h2>
  <div class="qz-opts">${qOrder(v.id,q.i,opts.length).map((i,k)=>{const o=opts[i];const st=!done?'':i===ans?'right':i===q.pick?'wrong':'dim';return `<button class="qz-o ${st}" data-a="qpick" data-i="${i}" ${done?'aria-disabled="true"':''}><span class="qz-l">${S.lang==='th'?TH[k]:'ABCD'[k]}</span><span>${_(o[0],o[1])}</span>${st==='right'?icon('check'):st==='wrong'?icon('x'):''}</button>`}).join('')}</div>
  ${done?`<div class="qz-x ${q.pick===ans?'ok':'no'}" role="status"><b>${q.pick===ans?_('ถูกต้อง!','Correct!'):_('ยังไม่ถูกค่ะ','Not quite')}</b><span><b class="qz-ans">${_('เฉลย','Answer')}:</b> ${_(opts[ans][0],opts[ans][1])} — ${_(xt,xe)}</span></div>
   <button class="qz-btn pri" data-a="qnext">${q.i+1<n?_('ข้อถัดไป','Next question'):_('ดูผลคะแนน','See my score')} ${icon('chev')}</button>`:''}
 </div></div>`}
const SERIES=[[1,{th:'ชุดที่ 1 · ความรู้ก่อนปลูกถ่ายตับ',en:'Series 1 · Before transplant'}],[2,{th:'ชุดที่ 2 · ช่วงรักษาตัวในโรงพยาบาล',en:'Series 2 · In hospital'}],[3,{th:'ชุดที่ 3 · ดูแลตัวเองที่บ้านหลังปลูกถ่าย',en:'Series 3 · At home after transplant'}]];
const vtile=v=>`<button class="vtile" data-a="vidopen" data-v="${v.id}" data-t="0" aria-label="${_('เล่นวิดีโอ','Play video')}: ${esc(L(v.title))}"><span class="vt-p"><img src="${v.poster}" alt="" loading="lazy"><span class="play">${icon('play')}</span><span class="dur num">${mmss(v.dur)}</span>${quizDone[qKey(v.id)]!=null?`<span class="qbadge">${icon('check')}${quizDone[qKey(v.id)]}/${(QZ[v.id]||[]).length}</span>`:''}</span><small>${_('ตอนที่','Ep.')} ${v.ep}</small><b>${esc(L(v.name||v.title))}</b></button>`;
function vidSeries(){return SERIES.map(([ph,t])=>{const vs=VIDEOS.filter(v=>v.ph===ph);if(!vs.length)return'';return `<section class="vser"><div class="vser-h"><h3>${esc(L(t))}</h3><span class="muted">${vs.length} ${_('ตอน','episodes')}</span></div><div class="vrow">${vs.map(vtile).join('')}</div></section>`}).join('')}
function videoCard(v){return `<button class="card vcard2" data-a="vidopen" data-v="${v.id}" data-t="0" aria-label="${_('เล่นวิดีโอ','Play video')}: ${esc(L(v.title))}"><span class="vc2-p"><img src="${v.poster}" alt="" loading="lazy"><span class="play">${icon('play')}</span><span class="dur num">${mmss(v.dur)}</span></span><span class="vc2-t"><span class="chip ph${v.ph}">${esc(L(v.label))}</span><b>${esc(L(v.title))}</b><small>${_('แตะเพื่อดูแบบเต็มจอ','Tap to watch full screen')}</small></span></button>`}
function vLearn(){
 return `<h2 class="sec-h">${_('วิดีโอความรู้กับพยาบาล','Video lessons with our nurse')}</h2>${vidSeries()}<p class="hint">${_('ดูจบแต่ละตอน มีแบบทดสอบสั้น ๆ 2 ข้อ พร้อมเฉลย','Each episode ends with a 2-question quiz and answers.')}</p>`;
}

/* ---------- staff views ---------- */
function vPatients(){
 const mine=myPatients(),ids=mine.map(p=>p.id),pend=pendingFor(ids);const ap7=D.appts.filter(a=>ids.includes(a.patientId)&&a.status==='scheduled'&&a.date>=todayISO&&a.date<=dOff(7)).length;
 return `<div class="grid g4"><div class="stat"><b>${mine.length}</b><span>${_('ผู้ป่วยที่ได้รับมอบหมาย','Assigned patients')}</span></div><div class="stat ${pend.syms.length+pend.vit.length?'warn':''}"><b>${pend.syms.length+pend.vit.length}</b><span>${_('บันทึกที่รอตรวจสอบ','Entries to review')}</span></div><div class="stat ${pend.rx.length?'warn':''}"><b>${pend.rx.length}</b><span>${_('ใบสั่งยารอตรวจทาน','Prescriptions to check')}</span></div><div class="stat"><b>${ap7}</b><span>${_('นัดหมายใน 7 วัน','Appointments, next 7 days')}</span></div></div>
 <h2 class="sec-h">${_('รายชื่อผู้ป่วย','Patients')}</h2>

const SUBS={"ep01":[[1.1,7.1,"Hello! Today I'll explain who needs a liver transplant."],[7.2,12.73,"A liver transplant treats a liver so damaged it no longer works,"],[12.73,16.45,"when other treatments have stopped helping."],[16.55,22.35,"Doctors consider three main groups of patients."],[22.45,26.54,"First: end-stage liver disease with a failing liver,"],[26.54,30.7,"such as ascites, confusion, or bleeding from varices."],[30.8,36.54,"Doctors use the MELD-Na score. At 15 or above,"],[36.54,42.9,"a transplant usually offers more benefit than risk."],[43.0,48.8,"Second: liver cancer that still meets the Milan criteria."],[48.9,55.78,"One tumour up to 5 cm, or up to 3 tumours each up to 3 cm,"],[55.78,60.4,"that have not spread outside the liver."],[60.5,66.45,"Third: acute liver failure, when the liver stops working suddenly"],[66.45,70.3,"in someone with no previous liver disease."],[70.4,77.8,"Timing matters. Too late, surgery may not be possible; too early, the risk may be higher."],[77.8,81.95,"The team will find the right time for each person."],[82.05,85.5,"Next time: what tests are needed before joining the waiting list."]],"ep02":[[1.15,4.84,"Before you join the transplant waiting list,"],[4.84,10.05,"the team checks you in many ways to prepare for major surgery."],[10.15,14.08,"It starts with your history, a physical exam, blood tests,"],[14.08,16.45,"and stool tests on 3 days in a row."],[16.55,19.21,"Then a chest X-ray, an ECG,"],[19.21,26.1,"and a CT or MRI of the abdomen to look at the liver and blood vessels."],[26.2,31.12,"Next come specialist assessments, starting with your mental health,"],[31.12,34.5,"with the consultation-liaison psychiatry team."],[34.6,39.28,"Your heart is checked with an ECG and an echocardiogram,"],[39.28,42.7,"and your lungs with a lung function test."],[42.8,45.69,"You'll be tested for hidden infections"],[45.69,48.8,"and get all your vaccines before surgery."],[48.9,52.44,"A stomach scope looks for varices,"],[52.44,57.85,"and a colonoscopy is done for your age or if needed."],[57.95,61.46,"Cancer screening outside the liver for your age,"],[61.46,64.75,"and dental treatment finished before surgery."],[64.85,71.23,"Then you'll meet the dietitian, social worker and physiotherapist"],[71.23,73.1,"to get fully ready."],[73.2,76.61,"When all tests are done, the whole team meets before listing you."],[76.61,79.55,"While waiting, you'll have check-ups every 6 to 8 weeks."],[79.65,82.5,"Next time: vaccines before a transplant."]],"ep03":[[0.6,6.0,"Today let's talk about vaccines before a liver transplant."],[6.1,9.92,"After a transplant you take anti-rejection medicine for life,"],[9.92,13.3,"so you catch infections more easily than other people."],[13.4,17.63,"Getting all your vaccines before surgery"],[17.63,20.8,"gives you the best protection."],[20.9,25.57,"Inactivated vaccines, like flu, pneumonia and COVID-19,"],[25.57,29.65,"can be given both before and after a transplant."],[29.75,36.7,"Live vaccines must not be given after a transplant."],[36.8,39.41,"If one is needed before surgery,"],[39.41,43.9,"it must be given at least 4 weeks before the operation."],[44.0,46.45,"After the transplant, wait at least 3 months before starting vaccines again."],[46.55,53.28,"There is a vaccine for hepatitis B. There's none for hepatitis C,"],[53.28,56.7,"but its medicines work very well."],[56.8,63.08,"Every time you get a vaccine, say you're waiting for or have had a liver transplant,"],[63.08,66.15,"and always ask the transplant team first."],[66.25,70.5,"Next time: caring for your teeth before a transplant."]],"ep04":[[1.25,6.45,"Now let's look after your teeth before the transplant."],[6.55,10.57,"After a transplant your immunity is very low."],[10.57,14.95,"Even a few mouth germs can spread into the blood."],[15.05,17.75,"And in the first months after surgery,"],[17.75,21.3,"dental work isn't possible except in an emergency."],[21.4,26.52,"The dentist will examine your mouth and take full-mouth X-rays"],[26.52,28.5,"to find hidden problems."],[28.6,32.7,"Then scaling, gum treatment, fillings,"],[32.7,37.35,"and removing teeth with long-term problems."],[37.45,41.47,"Finish dental work at least 2 to 4 weeks before surgery"],[41.47,43.95,"so your mouth can heal completely."],[44.05,47.31,"Always tell the dentist you have liver disease,"],[47.31,51.2,"because you may bleed easily and it can be hard to stop."],[51.3,56.47,"Don't buy painkillers yourself. NSAIDs are generally"],[56.47,60.25,"not allowed for people with cirrhosis."],[60.35,63.58,"While you wait, keep your mouth clean every day"],[63.58,65.5,"so you're ready for surgery."],[65.6,68.65,"Next time: what to eat while waiting for a transplant."]],"ep05":[[1.15,5.35,"What should you eat while waiting for a liver transplant? Let's see."],[5.45,11.11,"People with late-stage liver disease are often undernourished and lose muscle,"],[11.11,13.65,"which slows recovery after surgery."],[13.75,17.97,"So don't cut back on food too much."],[17.97,22.55,"The goal is enough energy and protein."],[22.65,27.57,"Choose good protein: fish, chicken, lean meat,"],[27.57,31.2,"egg whites, low-fat milk and tofu."],[31.3,35.31,"Eat brown rice and whole grains for energy,"],[35.31,39.6,"and avoid fried food and coconut-milk curries."],[39.7,42.99,"If you have ascites or swelling,"],[42.99,46.8,"limit salt to about 1 teaspoon a day."],[46.9,51.7,"Avoid raw or undercooked food, like raw larb, koi,"],[51.7,55.25,"raw fish, raw shellfish and raw eggs."],[55.35,61.23,"No alcohol of any kind, and avoid herbs or herbal brews"],[61.23,63.9,"with unknown ingredients."],[64.0,68.85,"Wash your hands before every meal, eat freshly cooked food,"],[68.85,70.5,"and avoid leftovers."],[70.6,76.85,"Your dietitian will help plan the right amount of food for you."],[76.95,80.25,"Next time: getting your body strong before surgery."]],"ep06":[[0.3,5.64,"The stronger you are before surgery, the faster you recover."],[5.64,7.95,"Let's get your body ready."],[8.05,11.63,"After major surgery everyone loses strength."],[11.63,16.75,"If you start strong, you have strength left and recover faster."],[16.85,21.29,"Practise belly breathing: hand on your belly, breathe in slowly through your nose,"],[21.29,24.75,"let your belly rise, then breathe out slowly through your mouth."],[24.85,30.15,"Practise with the breathing exerciser: sit up straight, seal your lips,"],[30.15,34.7,"breathe in slow and deep until the piston reaches the target."],[34.8,40.38,"Hold your breath for 2 to 3 seconds, then breathe out slowly."],[40.38,44.5,"Do this 10 times, then cough to clear phlegm."],[44.6,49.37,"Point your ankles up and down often, and do resistance exercise,"],[49.37,52.35,"starting light, such as half a kilogram."],[52.45,59.03,"Walk 10 to 15 minutes at a time at moderate effort,"],[59.03,62.0,"about 3 to 6 out of 10."],[62.1,67.44,"Get out of bed by rolling onto your side first, then pushing up to sit."],[67.44,70.15,"This puts less strain on your belly."],[70.25,74.08,"Don't hold your breath and strain when you exert yourself."],[74.08,77.25,"If you have varices, avoid lifting heavy things."],[77.35,81.47,"Stop exercising at once if you have chest pain, dizziness,"],[81.47,83.25,"turn pale, or feel faint."],[83.35,88.15,"Next time: preparing your mind before a transplant."]],"ep07":[[0.25,3.11,"Waiting for a transplant can be worrying."],[3.11,5.2,"Today let's prepare your mind."],[5.3,10.28,"Worry is normal. A little worry keeps us alert"],[10.28,13.1,"and helps us prepare well."],[13.2,15.73,"Before listing, everyone talks with"],[15.73,18.7,"the consultation-liaison psychiatry team."],[18.8,24.33,"They'll talk about your feelings, your caregiver, what you understand about surgery,"],[24.33,27.1,"and anything you may need to change first."],[27.2,31.01,"This assessment isn't about ruling you out. The team will find solutions with you"],[31.01,32.8,"and keep supporting you after surgery."],[32.9,38.19,"If you used to drink alcohol, you must stop completely for at least 6 months"],[38.19,40.55,"and be assessed by a psychiatrist."],[40.65,44.05,"No smoking and no drugs of any kind."],[44.15,49.71,"Joining a group of people waiting for or after a transplant"],[49.71,53.95,"lets you share experiences and encouragement."],[54.05,58.68,"If you feel sad, hopeless, can't sleep, or are very anxious, tell the team anytime."],[58.68,60.3,"Experts are here to help you."],[60.4,64.75,"Next time: caregivers and social workers."]],"ep08":[[0.3,3.89,"A liver transplant needs a caregiver."],[3.89,6.6,"Let's talk about that today."],[6.7,10.17,"Caregivers take you to appointments, help with medicines,"],[10.17,13.1,"and support you while you recover after surgery."],[13.2,16.38,"Have both a main caregiver and a backup caregiver"],[16.38,18.85,"for days the main one isn't available."],[18.95,24.58,"The social worker will ask about your family, who earns the income,"],[24.58,27.85,"and who helps make treatment decisions."],[27.95,30.31,"Also your job, income, expenses, debts,"],[30.31,32.55,"and the healthcare coverage you have."],[32.65,38.84,"They'll find support networks, such as relatives, the community,"],[38.84,43.0,"local government and patient support funds."],[43.1,47.5,"There may be a home visit to check that your home is clean, safe, and suitable for recovery."],[47.6,53.83,"If you're worried about costs, tell the social worker early."],[53.83,56.95,"They can help arrange support."],[57.05,60.3,"Next time: what to watch for while you wait."]],"ep09":[[1.1,5.65,"What symptoms should you watch for while waiting? Let's see."],[5.75,10.38,"While you wait, the team sees you every 6 to 8 weeks"],[10.38,14.65,"so you're ready for surgery when an organ comes."],[14.75,19.02,"If your belly grows, you swell, or your weight goes up fast,"],[19.02,21.8,"it may be ascites. Tell your care team."],[21.9,24.57,"If you vomit blood or pass black stools,"],[24.57,27.65,"go to the emergency room or call 1669 at once."],[27.75,31.38,"Confusion, drowsiness or a change in behaviour"],[31.38,34.7,"may mean the liver is affecting the brain."],[34.8,39.8,"Fever with belly pain may mean an infection in the abdomen."],[39.9,45.5,"Passing less urine may be a kidney complication."],[45.6,49.83,"Record your weight, blood pressure and symptoms in the app,"],[49.83,53.8,"but if symptoms are severe, don't wait for a reply in the app."],[53.9,58.1,"Come to every appointment, take your medicines as prescribed,"],[58.1,60.65,"and avoid alcohol, smoking and drugs."],[60.75,64.35,"That's the last episode of the before-transplant series."],[64.35,66.15,"Next: your stay in hospital."]],"ep10":[[0.9,4.63,"A liver transplant is major surgery."],[4.63,9.5,"Let's see what you'll find after the operation."],[9.6,15.1,"After surgery you'll stay in the intensive care unit, or ICU,"],[15.1,18.25,"where the team watches you closely."],[18.35,25.18,"At first you may have a breathing tube, IV lines, wound drains and a urinary catheter."],[25.18,28.35,"The team removes them when you're ready."],[28.45,32.28,"The monitors beep from time to time."],[32.28,36.0,"That's normal, so don't be alarmed."],[36.1,41.06,"If your wound hurts, tell the nurse and rate the pain from 0 to 10."],[41.06,43.2,"The team will help manage it."],[43.3,49.03,"Some people are briefly confused or have strange dreams after surgery."],[49.03,54.35,"The team watches closely, and it usually improves as you recover."],[54.45,59.45,"Family can visit during ward visiting hours. Wash your hands every time,"],[59.45,63.0,"and don't visit if you have a fever or feel unwell."],[63.1,67.08,"If you feel scared, stressed or can't sleep, tell the team."],[67.08,70.45,"Mental health support is there for you throughout."],[70.55,75.75,"Next time: how moving early helps you recover faster."]],"ep11":[[1.2,5.5,"After surgery, the sooner you move, the faster you recover."],[5.6,9.1,"Lying still for a long time weakens muscles very quickly,"],[9.1,12.05,"and the lungs may collapse and fill with phlegm."],[12.15,19.95,"The physiotherapist starts rehab as soon as your vital signs are stable, even in the ICU."],[20.05,28.5,"At first the physiotherapist moves your joints and has you point your ankles up and down to help blood flow."],[28.6,34.81,"When you're more awake, use the breathing exerciser you practised before surgery"],[34.81,37.3,"and practise coughing up phlegm."],[37.4,41.41,"Get out of bed by rolling onto your side, then pushing up to sit."],[41.41,44.75,"Hug a pillow gently against your wound when you cough."],[44.85,49.09,"Then slowly sit at the bedside, stand and walk,"],[49.09,52.6,"always with a nurse or physiotherapist."],[52.7,58.39,"Moving early helps you come off the ventilator sooner,"],[58.39,63.45,"reduces lung problems, and gets you home sooner."],[63.55,67.33,"Next time: preventing infection in hospital."]],"ep12":[[1.15,4.01,"After a transplant your immunity is low."],[4.01,6.65,"Everyone must help prevent infection."],[6.75,11.92,"Anti-rejection medicine stops your body attacking the new liver,"],[11.92,15.55,"but it also makes infections easier to catch."],[15.65,21.1,"Everyone who touches the patient must wash their hands or use alcohol gel first. Patients may remind staff."],[21.2,27.15,"Relatives with fever, cough, sore throat or a cold should not visit,"],[27.15,30.65,"and should wear a mask near the patient."],[30.75,33.47,"Let staff look after the wound and tubes."],[33.47,36.65,"Patients shouldn't pick at or scratch the wound."],[36.75,40.88,"Relatives shouldn't bring raw food, leftovers,"],[40.88,43.85,"or food the team hasn't approved."],[43.95,48.43,"Don't bring fresh flowers or plants when visiting,"],[48.43,50.4,"as the ward rules say."],[50.5,57.95,"If you have chills, fever, cough, burning when you pee, or a more painful, swollen wound, tell the nurse at once."],[58.05,61.05,"Next time: getting ready to go home."]],"ep13":[[0.85,5.5,"You'll soon be going home. Let's get ready."],[5.6,10.18,"Before going home, learn each medicine's name, dose and time,"],[10.18,12.8,"both the patient and the caregiver."],[12.9,17.36,"Practise measuring and recording blood pressure, pulse, temperature,"],[17.36,19.85,"weight and symptoms in the app."],[19.95,23.8,"Know the warning signs to report to the team,"],[23.8,25.85,"and how to contact them."],[25.95,28.41,"Get your next appointment and blood test dates."],[28.41,30.45,"At first you'll come to hospital often."],[30.55,33.49,"Your caregiver must be ready to help with medicines,"],[33.49,35.35,"appointments and support at home."],[35.45,38.94,"Get your home clean, well-ventilated,"],[38.94,42.05,"with a comfortable place to rest."],[42.15,46.65,"Write down any questions and ask the team before you leave."],[46.65,48.55,"No question is too small."],[48.65,51.7,"That's the end of the hospital series."],[51.7,55.95,"Next: caring for yourself at home after a transplant."]],"ep15":[[1.0,2.99,"Other medicines, herbs and supplements"],[2.99,5.25,"can interfere with anti-rejection medicine."],[5.35,12.2,"Some medicines push anti-rejection drug levels too high or too low,"],[12.2,14.35,"which can cause harm."],[14.45,18.65,"Before any new medicine, including ones you buy yourself,"],[18.65,21.9,"ask the transplant team or pharmacist first."],[22.0,27.08,"Don't take herbs, herbal brews, herbal pills or supplements"],[27.08,29.15,"without asking the team."],[29.25,34.2,"Some painkillers affect the kidneys. Don't buy them yourself."],[34.3,37.93,"Always tell doctors, dentists and pharmacists"],[37.93,40.75,"that you've had a liver transplant."],[40.85,43.52,"Carry a list of your medicines,"],[43.52,46.7,"or open it anytime in the app."],[46.8,50.7,"Live vaccines must not be given after a transplant,"],[50.7,54.45,"and wait at least 3 months before other vaccines."],[54.55,58.15,"Next time: preventing infection at home."]],"ep16":[[0.8,4.35,"You're back home, but you still need to guard against infection."],[4.45,8.72,"Wash your hands often, especially before eating,"],[8.72,12.9,"after using the toilet, and when you come home."],[13.0,16.05,"Wear a mask in public places or at the hospital,"],[16.05,18.65,"and stay away from people who are unwell."],[18.75,25.25,"Eat freshly cooked food. Avoid raw food, raw larb, koi and raw eggs,"],[25.25,27.35,"and drink clean water."],[27.45,31.21,"If you garden or touch soil, wear gloves"],[31.21,33.75,"and always wash your hands."],[33.85,37.36,"If you have pets, let someone else clean cages or litter boxes,"],[37.36,39.75,"and wash your hands after touching animals."],[39.85,43.6,"Brush your teeth every day and keep your mouth clean."],[43.7,49.92,"If you have a fever, chills, cough or sore throat, tell the team."],[49.92,53.75,"Don't just take fever medicine and wait."],[53.85,58.25,"Next time: warning signs after a transplant."]],"ep17":[[1.15,5.15,"After a transplant, some warning signs must be reported to the team quickly."],[5.25,8.6,"Fever or chills — with low immunity,"],[8.6,11.85,"infections can become serious fast."],[11.95,16.75,"Yellow skin or eyes, dark urine or pale stools"],[16.75,20.3,"may mean a problem with the liver."],[20.4,24.98,"Severe belly pain, bloating, or a red, swollen wound"],[24.98,27.1,"that leaks fluid or pus."],[27.2,31.55,"Vomiting or diarrhoea so bad you can't take your medicine,"],[31.55,34.4,"because your drug levels may go wrong."],[34.5,40.0,"If you miss or take the wrong anti-rejection medicine, call the team."],[40.1,45.26,"If you have trouble breathing, faint, bleed heavily or get worse fast,"],[45.26,48.65,"go to the emergency room or call 1669 at once."],[48.75,53.43,"Use the symptom check in the app to record symptoms,"],[53.43,57.95,"but if they're severe, don't wait for a reply in the app."],[58.05,62.5,"Next time: follow-up visits and blood tests."]],"ep18":[[1.0,4.55,"After a transplant, keeping your appointments is very important."],[4.65,9.33,"At first after going home you'll have frequent check-ups and blood tests,"],[9.33,12.15,"then they'll space out as you become stable."],[12.25,16.69,"Blood tests show how your liver, kidneys and blood cells are working,"],[16.69,19.0,"and your anti-rejection drug levels."],[19.1,22.92,"If your drug level is being checked that day, follow the team's advice"],[22.92,25.75,"on when to take your medicine before the blood test."],[25.85,30.95,"Bring your medicine list, your record book or the app every time."],[31.05,33.63,"Write your questions down beforehand,"],[33.63,37.25,"and tell the team about any changes in how you feel."],[37.35,43.98,"Long term, the team also checks blood pressure, sugar, cholesterol and kidney function,"],[43.98,46.65,"because some medicines affect them."],[46.75,52.7,"People on anti-rejection medicine have a higher risk of skin cancer."],[52.7,56.9,"Use sun protection and keep up cancer screening."],[57.0,59.5,"Next time: living your new life well, for the long term."]],"ep19":[[1.55,3.2,"A new liver is a new chance."],[3.2,6.5,"Let's look after it so it stays with us for a long time."],[6.6,8.57,"No alcohol for life."],[8.57,12.5,"Drinking again can damage the new liver."],[12.6,15.6,"No smoking and no drugs of any kind."],[15.7,20.58,"Eat from all 5 food groups, cut down on sugar, fat and salt,"],[20.58,24.0,"and keep your weight from rising too much."],[24.1,27.8,"Increase exercise slowly, starting with walking,"],[27.8,31.8,"and avoid heavy lifting until the team says it's OK."],[31.9,36.66,"In the first year after a transplant you may feel stressed or low."],[36.66,38.75,"If so, tell the team anytime."],[38.85,43.71,"Ask the team when you're ready to go back to work,"],[43.71,45.65,"drive or travel far."],[45.75,55.99,"Talk with others who've had a transplant, and let your caregiver rest too."],[55.99,60.0,"It helps everyone keep going."],[60.1,61.97,"Thank you for watching to the end."],[61.97,64.55,"You can find all the lessons in the app."]],"ep14-1":[[1.2,5.16,"Hello! Now you're home, the most important thing"],[5.16,9.2,"is taking your anti-rejection medicine correctly."],[9.3,16.15,"Everyone who receives an organ transplant must take anti-rejection medicine"],[16.15,21.45,"to prevent the body rejecting the organ — graft rejection."],[21.55,27.02,"In the first week after surgery you'll have both injected and oral medicines."],[27.02,30.85,"After that only oral medicines remain, taken for life."],[30.95,35.06,"So your cooperation is a key factor"],[35.06,39.05,"in helping you live a longer life."],[39.15,42.51,"Commonly used oral anti-rejection medicines are"],[42.51,45.65,"Prograf, Advagraf, and CellCept or Myfortic."],[45.75,50.1,"Next time: getting to know Prograf and Advagraf."]],"ep14-2":[[0.5,4.15,"Now let's get to know Prograf and Advagraf."],[4.25,10.36,"Prograf blocks white blood cells and works right away."],[10.36,16.8,"Take it twice a day, morning and evening, 12 hours apart."],[16.9,21.36,"Our hospital has Prograf in 2 strengths:"],[21.36,26.6,"white 1 mg capsules and yellow 0.5 mg capsules."],[26.7,33.5,"Advagraf is the same kind of medicine but releases slowly over 24 hours,"],[33.5,38.6,"so it's taken once a day. It comes in 1 mg and 0.5 mg."],[38.7,52.32,"Possible side effects: headache, dizziness, nausea, vomiting, numb hands and feet,"],[52.32,61.95,"shaky hands, diarrhoea, hair loss and high blood pressure."],[62.05,65.13,"Your doctor chooses the medicine that suits you — usually Prograf —"],[65.13,67.1,"and checks blood levels to adjust the dose."],[67.2,70.15,"Next time: getting to know Myfortic."]],"ep14-3":[[0.3,5.15,"Now let's look at another group: CellCept and Myfortic."],[5.25,11.69,"These medicines stop white blood cells from multiplying."],[11.69,16.75,"CellCept and Myfortic work in a similar way."],[16.85,24.27,"But Myfortic is designed to release in the small intestine, which reduces stomach side effects"],[24.27,28.3,"such as belly pain, diarrhoea, nausea and vomiting."],[28.4,34.2,"So after surgery doctors often choose Myfortic instead of CellCept,"],[34.2,36.1,"together with Prograf."],[36.2,42.82,"Our hospital has Myfortic in 2 strengths, 360 mg and 180 mg."],[42.82,46.9,"Take the dose your doctor prescribes."],[47.0,50.15,"Next time: how to take Prograf, and what to do if you miss a dose."]],"ep14-4":[[0.7,7.35,"Now let's see how to take Prograf, and what to do if you miss a dose."],[7.45,15.29,"Take the prescribed dose twice a day, before breakfast and dinner, 12 hours apart,"],[15.29,20.55,"at the same times every day, for example 6 am and 6 pm."],[20.65,27.04,"If you miss a dose and it's been less than 6 hours, take it as soon as you remember."],[27.04,30.85,"If it's more than 6 hours, wait for the next dose."],[30.95,37.25,"For example, you miss the 6 am dose but remember at 11 am:"],[37.25,42.25,"take it now, then take the 6 pm dose as usual."],[42.35,46.87,"But if you remember at 1 pm, that's over 6 hours,"],[46.87,51.3,"so wait for the 6 pm dose, without taking extra."],[51.4,57.25,"Remember: never take extra medicine to make up for a missed dose."],[57.35,62.05,"Next time: how to take Advagraf, and taking medicine on an empty stomach."]],"ep14-5":[[0.25,5.75,"Now let's see how to take Advagraf, and taking medicine on an empty stomach."],[5.85,9.98,"Take Advagraf once a day before breakfast,"],[9.98,14.4,"at the same time every day, for example 6 am."],[14.5,21.12,"If you miss it and it's been less than 12 hours, take it as soon as you remember."],[21.12,25.7,"If it's more than 12 hours, skip to the next day's dose."],[25.8,32.36,"For example, for a 6 am dose: if you remember before 6 pm, take it now."],[32.36,39.65,"If after 6 pm, skip that day and take the next 6 am dose, without taking extra."],[39.75,44.42,"Prograf and Advagraf are absorbed best on an empty stomach,"],[44.42,48.7,"so take them 1 hour before food or 1 to 2 hours after."],[48.8,57.99,"For example, for a 6 am dose, don't eat from 5 to 7 am;"],[57.99,65.0,"for a 6 pm dose, don't eat from 5 to 7 pm."],[65.1,70.0,"Next time: fruits to avoid with your medicine, and things to do."]],"ep14-6":[[1.0,7.2,"Now let's look at precautions and good habits with anti-rejection medicine."],[7.3,17.6,"Don't take your medicine with grapefruit, thick-skinned oranges, mandarins, pomelo or lime, or their juice."],[17.6,21.35,"They can raise drug levels dangerously."],[21.45,25.35,"Take your medicine regularly and on time."],[25.35,29.35,"Never change the dose or stop it yourself."],[29.45,34.63,"Swallow capsules whole — don't open them, especially Advagraf —"],[34.63,38.9,"and keep them away from sunlight, heat and moisture."],[39.0,44.79,"Remember or write down your medicine names. If another doctor prescribes something new,"],[44.79,48.85,"always check whether it affects your anti-rejection medicine."],[48.95,54.6,"Choose freshly cooked food and peeled fruit, and come to every appointment"],[54.6,58.65,"so your levels can be checked and your dose adjusted."],[58.75,64.33,"If you have any questions, ask the nurses anytime."],[64.33,68.8,"We wish you good health and a long life."],[68.9,74.9,"Next time: other medicines, herbs and supplements — what to watch for."]]};
let CC=(()=>{try{return localStorage.getItem('sj-cc')!=='0'}catch(e){return true}})();
function subsHook(vp){const cues=SUBS[S.modal?.id],cap=document.getElementById('vcap');if(!cues||!cap)return;const sp=cap.firstChild;let last=-2;
 const upd=()=>{const t=vp.currentTime;let i=-1;for(let k=0;k<cues.length;k++){if(t>=cues[k][0]&&t<cues[k][1]){i=k;break}}if(i!==last){last=i;sp.textContent=i<0?'':cues[i][2];cap.classList.toggle('empty',i<0)}};
 const loop=()=>{if(!vp.isConnected)return;upd();if(!vp.paused&&!vp.ended)requestAnimationFrame(loop)};
 vp.addEventListener('play',()=>requestAnimationFrame(loop));vp.addEventListener('seeked',upd);vp.addEventListener('timeupdate',upd);upd()}
function popModal(app){const k=S.modal?S.modal.kind+(S.modal.id||''):null;if(k&&S._mk!==k)app.querySelector('.overlay')?.classList.add('pop');S._mk=k}
let carT=null,carHold=0;
function carTo(i){const t=document.getElementById('car');if(!t)return;const s=t.children[i];if(s)t.scrollTo({left:s.offsetLeft-t.offsetLeft,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function carIdx(t){return Math.round(t.scrollLeft/Math.max(1,t.clientWidth))}
const carPause=()=>{carHold=Date.now()+12000};
function carInit(){clearInterval(carT);const t=document.getElementById('car');if(!t)return;const dots=[...document.querySelectorAll('.dots button')];
 t.addEventListener('scroll',()=>{const i=carIdx(t);dots.forEach((b,k)=>b.classList.toggle('on',k===i))},{passive:true});
 t.addEventListener('pointerdown',carPause,{passive:true});
 if(t.children.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)carT=setInterval(()=>{if(!document.getElementById('car'))return clearInterval(carT);if(Date.now()<carHold||S.modal||document.hidden)return;carTo((carIdx(t)+1)%t.children.length)},6500)}
function markChap(vp){const v=VIDEOS.find(x=>x.id===S.modal?.id);if(!v)return;let idx=0;v.ch.forEach((c,i)=>{if(vp.currentTime>=c[0]-0.3)idx=i});document.querySelectorAll('.modal .chap-b').forEach((b,i)=>b.classList.toggle('on',i===idx))}

 remtaken:()=>{const m=S.modal;if(!m||!canRecord(m.pid))return;let n=0;m.keys.forEach(([iid,rid])=>{if(lastLog(m.pid,iid,todayISO,m.time))return;D.medLogs.push({id:uid('m'),patientId:m.pid,itemId:iid,rxId:rid,date:todayISO,time:m.time,status:'taken',by:S.user.id,at:nowStamp()});n++});

 revvit:d=>{const v=D.vitals.find(x=>x.id===d.id);if(!v)return;v.verified=true;v.verifiedBy=S.user.id;audit(`ตรวจสอบบันทึกสุขภาพที่ญาติบันทึก วันที่ ${v.date} ${v.time}`,`Checked caregiver health entry ${v.date} ${v.time}`,v.patientId);render();toast(_('ตรวจสอบแล้ว','Marked checked'))},
 apptconfirm:d=>{const a=D.appts.find(x=>x.id===d.id);a.confirmed=true;audit(`ยืนยันนัดหมาย ${L(a.type)} ${a.date}`,`Confirmed appointment ${a.type.en||a.type} ${a.date}`,a.patientId);render();toast(_('ยืนยันนัดหมายแล้ว','Appointment confirmed'))},
 apptdone:d=>{const a=D.appts.find(x=>x.id===d.id);a.status='done';audit(`บันทึกว่ามาตามนัด ${L(a.type)}`,`Marked attended: ${a.type.en||a.type}`,a.patientId);render()},
 apptcancel:d=>{const a=D.appts.find(x=>x.id===d.id);a.status='cancelled';audit(`ยกเลิกนัดหมาย ${L(a.type)} ${a.date}`,`Cancelled appointment ${a.type.en||a.type} ${a.date}`,a.patientId);notify(a.patientId,`นัดหมาย “${L(a.type)}” วันที่ ${fmtDate(a.date)} ถูกยกเลิก`,`Appointment “${a.type.en||a.type}” on ${a.date} was cancelled`);render()},
 labadd:d=>{S.modal={kind:'lab',pid:d.pid};render();CHG.labtest(document.getElementById('lb-test'))},
 apptadd:d=>{S.modal={kind:'appt',pid:d.pid};render()},
 invite:()=>{S.modal={kind:'invite'};render()},
 revoke:d=>{const c=D.consents.find(x=>x.id===d.cs);c.active=false;audit(`เพิกถอนสิทธิ์ของ ${nameOf(c.caregiverId)}`,`Revoked access for ${C(c.caregiverId).name.en}`,c.patientId);render();toast(_('เพิกถอนสิทธิ์แล้ว','Access revoked'))},
 restore:d=>{const c=D.consents.find(x=>x.id===d.cs);c.active=true;audit(`ให้สิทธิ์ ${nameOf(c.caregiverId)} อีกครั้ง`,`Restored access for ${C(c.caregiverId).name.en}`,c.patientId);render()},
 eduph:d=>{S.eduPhase=d.ph;render()},
 artopen:d=>{S.modal={kind:'article',id:d.id};render()},
 artadd:d=>{S.modal={kind:'artadd',topic:d.topic};render()},
 artreview:d=>{const a=D.education.find(x=>x.id===d.id);if(!a||S.user.role!=='staff')return;a.reviewed=true;a.reviewedBy=S.user.id;a.reviewedAt=nowStamp();audit(`ตรวจทานบทเรียน “${a.title.th}”`,`Reviewed lesson “${a.title.en}”`);render();toast(_('บันทึกว่าตรวจทานแล้ว ผู้ป่วยจะเห็นเป็นฉบับจริง','Marked reviewed; patients now see it as final'))},
 qstart:()=>{if(S.modal?.kind==='video'){S.modal.quiz={i:0,pick:null,score:0};render()}},
 qpick:d=>{const q=S.modal?.quiz;if(!q||q.pick!=null)return;q.pick=+d.i;if(q.pick===QZ[S.modal.id][q.i][3])q.score++;render();setTimeout(()=>document.querySelector('.qz-x')?.scrollIntoView({block:'nearest',behavior:'smooth'}),30)},
 qnext:()=>{const q=S.modal?.quiz;if(!q)return;q.i++;q.pick=null;if(q.i>=QZ[S.modal.id].length)quizDone[qKey(S.modal.id)]=q.score;render()},
 qreplay:()=>{S.modal={kind:'video',id:S.modal.id,t:0};render()},
 qnextvid:()=>{const nv=nextVid(S.modal.id);if(nv){S.modal={kind:'video',id:nv.id,t:0};render()}},
 vidopen:d=>{S.modal={kind:'video',id:d.v,t:+d.t||0};S.moreOpen=false;render()},
 vidseek:d=>{const vp=document.getElementById('vplayer');if(!vp)return;vp.currentTime=+d.t;vp.play().catch(()=>{});markChap(vp)},
 critconfirm:()=>{Object.assign(D.settings,{criteriaConfirmed:true,confirmedBy:S.user.id,confirmedAt:nowStamp()});audit('ยืนยันเกณฑ์อาการเตือน','Confirmed warning criteria');render();toast(_('ยืนยันเกณฑ์แล้ว','Criteria confirmed'))},
};
const FORMS={
 vitals:(o,fd,f)=>{const pid=f.dataset.pid;if(!canRecord(pid))return;o.note=o.note||'';if('bp' in o){const t=String(o.bp).trim();o.sys='';o.dia='';if(t){const m=t.match(/^(\d{2,3})\s*[\/\-\s]\s*(\d{2,3})$/);if(!m)return fail(f,_('กรอกความดันแบบ ตัวบน/ตัวล่าง เช่น 120/80','Enter blood pressure as upper/lower, e.g. 120/80'));o.sys=m[1];o.dia=m[2]}}
  const R={sys:[60,260,_('ความดันตัวบน','Systolic BP')],dia:[30,160,_('ความดันตัวล่าง','Diastolic BP')],hr:[30,220,_('ชีพจร','Heart rate')],rr:[6,60,_('อัตราการหายใจ','Breathing rate')],temp:[33,43,_('อุณหภูมิ','Temperature')],spo2:[50,100,'SpO₂'],wt:[20,250,_('น้ำหนัก','Weight')]};
  const v={};for(const k in R){const n=num(o[k]);if(n===null){v[k]=null;continue}if(isNaN(n)||n<R[k][0]||n>R[k][1])return fail(f,_(`${R[k][2]}: ค่าดูไม่ถูกต้อง โปรดตรวจสอบอีกครั้ง`,`${R[k][2]}: that value looks wrong, please check it`));v[k]=n}
  if(Object.values(v).every(x=>x===null)&&!o.feel&&!o.appetite&&!o.sleep&&!o.note.trim())return fail(f,_('กรอกอย่างน้อยหนึ่งช่องก่อนบันทึก','Fill in at least one field'));
  const by=S.user.id,r=S.user.role;D.vitals.push({id:uid('v'),patientId:pid,date:o.date||todayISO,time:o.time||nowHM(),...v,feel:o.feel,appetite:o.appetite,sleep:o.sleep,note:o.note.trim(),by,verified:r==='caregiver'?false:null});
  audit(r==='caregiver'?'ญาติบันทึกสุขภาพประจำวัน':'บันทึกสุขภาพประจำวัน',r==='caregiver'?'Caregiver logged daily health':'Logged daily health',pid);render();window.scrollTo(0,0);
  toast(r==='caregiver'?_('บันทึกแล้ว ติดป้าย “ญาติบันทึก” รอบุคลากรตรวจสอบ','Saved, labelled “By caregiver” until staff check it'):_('บันทึกแล้ว','Saved'))},
 symptoms:(o,fd,f)=>{const pid=f.dataset.pid;if(!canRecord(pid))return;const syms=fd.getAll('sym');let level='none';syms.forEach(id=>{const c=D.criteria.find(x=>x.id===id);if(c&&LEVELS[c.level].w>LEVELS[level].w)level=c.level});
  D.symptoms.push({id:uid('sy'),patientId:pid,date:todayISO,time:nowHM(),syms,level,note:(o.note||'').trim(),by:S.user.id,reviewed:level==='none'});
  audit(`${S.user.role==='caregiver'?'ญาติ':''}บันทึกการประเมินอาการ: ${L(LEVELS[level].label)}`,`${S.user.role==='caregiver'?'Caregiver ':''}symptom check: ${LEVELS[level].label.en}`,pid);
  S.modal={kind:'symres',level,syms};render()},
 rx:(o,fd,f)=>{const dr=collectRx();S.rxDraft=dr;
  if(!dr.doctor.trim())return fail(f,_('กรุณาระบุแพทย์ผู้สั่งยา','Enter the prescriber'));
  const items=dr.items.filter(it=>it.name.trim()||it.dose.trim()||it.times.trim());if(!items.length)return fail(f,_('เพิ่มรายการยาอย่างน้อย 1 รายการ','Add at least one medicine'));
  for(let i=0;i<items.length;i++){const it=items[i];if(!it.name.trim()||!it.dose.trim())return fail(f,_(`รายการที่ ${i+1}: ระบุชื่อยาและขนาดยาตามใบสั่ง`,`Item ${i+1}: enter the medicine and dose`));if(!parseTimes(it.times))return fail(f,_(`รายการที่ ${i+1}: เวลาไม่ถูกต้อง ใช้รูปแบบ 08:00, 20:00`,`Item ${i+1}: use times like 08:00, 20:00`));if(it.end&&it.start&&it.end<it.start)return fail(f,_(`รายการที่ ${i+1}: วันที่สิ้นสุดอยู่ก่อนวันที่เริ่ม`,`Item ${i+1}: end date is before start date`))}
  const rx={id:uid('rx'),no:rxNo(),patientId:S.pid,doctor:dr.doctor.trim(),date:dr.date||todayISO,enteredBy:S.user.id,enteredAt:nowStamp(),status:'pending',items:items.map(it=>({id:uid('i'),name:it.name.trim(),form:it.form.trim(),dose:it.dose.trim(),times:parseTimes(it.times),start:it.start||todayISO,end:it.end||'',note:it.note.trim()}))};
  D.prescriptions.push(rx);audit(`บันทึกใบสั่งยา ${rx.no} (${rx.items.length} รายการ)${dr.verify?' รอตรวจทาน':''}`,`Entered prescription ${rx.no} (${rx.items.length} items)${dr.verify?', awaiting check':''}`,rx.patientId);
  if(!dr.verify){const old=activeRx(rx.patientId);activate(rx);audit(`เผยแพร่ใบสั่งยา ${rx.no}${old?` · ${old.no} ถูกเก็บเป็นประวัติ`:''}`,`Published ${rx.no}${old?` · ${old.no} moved to history`:''}`,rx.patientId)}
  S.rxDraft=null;S.tab='meds';go('patient');toast(dr.verify?_('บันทึกแล้ว รอบุคลากรอีกคนตรวจทาน','Saved, waiting for a second check'):_('เผยแพร่ใบสั่งยาแล้ว ผู้ป่วยได้รับแจ้งเตือน','Published. The patient has been notified.'))},
 cancelrx:(o,fd,f)=>{const rx=D.prescriptions.find(r=>r.id===f.dataset.id);const reason=(o.reason||'').trim();if(reason.length<3)return fail(f,_('กรุณาระบุเหตุผล','Enter a reason'));const wasActive=rx.status==='active';
  Object.assign(rx,{status:'cancelled',cancelReason:reason,cancelledBy:S.user.id,cancelledAt:nowStamp()});audit(`ยกเลิกใบสั่งยา ${rx.no} เหตุผล: ${reason}`,`Cancelled ${rx.no}. Reason: ${reason}`,rx.patientId);
  S.modal=null;if(wasActive){notify(rx.patientId,`ใบสั่งยา ${rx.no} ถูกยกเลิก ทีมรักษากำลังบันทึกรายการที่ถูกต้อง`,`Prescription ${rx.no} was cancelled. The team is entering the correct one.`);S.rxDraft={doctor:L(rx.doctor),date:rx.date,verify:true,items:rx.items.map(it=>({name:it.name,form:L(it.form),dose:L(it.dose),times:it.times.join(', '),start:todayISO,end:'',note:L(it.note)}))};go('rxnew');toast(_('ยกเลิกแล้ว แก้รายการให้ถูกต้องแล้วบันทึกเป็นฉบับใหม่','Cancelled. Correct the items and save as a new prescription.'))}else{render();toast(_('ยกเลิกแล้ว','Cancelled'))}},
 lab:(o,fd,f)=>{const pid=f.dataset.pid;const v=num(o.value),lo=num(o.low),hi=num(o.high);if(v===null||isNaN(v))return fail(f,_('กรุณาระบุผลตรวจเป็นตัวเลข','Enter the result as a number'));if(isNaN(lo)||isNaN(hi))return fail(f,_('ช่วงอ้างอิงต้องเป็นตัวเลข','Range must be numbers'));if(lo!=null&&hi!=null&&lo>hi)return fail(f,_('ค่าต่ำสุดมากกว่าค่าสูงสุด','Low is above high'));
  D.labs.push({id:uid('l'),patientId:pid,test:o.test,value:v,unit:o.unit.trim(),refLow:lo,refHigh:hi,date:o.date||todayISO,time:o.time||'07:00',source:o.source.trim(),by:S.user.id});audit(`บันทึกผล ${LAB(o.test).name} = ${v} ${o.unit}`,`Entered ${LAB(o.test).name} = ${v} ${o.unit}`,pid);
  notify(pid,`มีผลตรวจ ${LAB(o.test).name} ใหม่`,`New ${LAB(o.test).name} result`);S.modal=null;render();toast(_('บันทึกผลตรวจแล้ว','Result saved'))},
 appt:(o,fd,f)=>{const pid=f.dataset.pid;if(!o.type.trim()||!o.date||!o.time)return fail(f,_('กรอกรายการนัด วันที่ และเวลา','Enter the appointment, date and time'));
  D.appts.push({id:uid('ap'),patientId:pid,type:o.type.trim(),date:o.date,time:o.time,loc:o.loc.trim(),prep:o.prep.trim(),status:'scheduled',confirmed:false,by:S.user.id});audit(`เพิ่มนัดหมาย ${o.type.trim()} ${o.date} ${o.time}`,`Added appointment ${o.type.trim()} ${o.date} ${o.time}`,pid);
  notify(pid,`มีนัดหมายใหม่: ${o.type.trim()} วันที่ ${fmtDate(o.date)} ${o.time}`,`New appointment: ${o.type.trim()} on ${o.date} ${o.time}`);S.modal=null;render();toast(_('บันทึกนัดหมายแล้ว','Appointment saved'))},
 invite:(o,fd,f)=>{if(!o.name.trim()||!o.rel.trim())return fail(f,_('กรอกชื่อและความสัมพันธ์','Enter a name and relationship'));const id=uid('c');D.caregivers.push({id,name:o.name.trim(),phone:o.phone.trim()||'—'});
  D.consents.push({id:uid('cs'),caregiverId:id,patientId:S.user.id,relation:o.rel.trim(),active:true,since:todayISO,perms:Object.fromEntries(PERMS.map(([k])=>[k,!!o['p_'+k]]))});audit(`เพิ่มญาติ ${o.name.trim()} (${o.rel.trim()})`,`Added family member ${o.name.trim()}`,S.user.id);S.modal=null;render();toast(_('เพิ่มญาติแล้ว','Family member added'))},
 article:(o,fd,f)=>{if(!o.tth.trim()||!o.bth.trim())return fail(f,_('กรอกชื่อและเนื้อหาภาษาไทย','Enter the Thai title and content'));D.education.push({id:uid('e'),topic:o.topic,title:{th:o.tth.trim(),en:o.ten.trim()||o.tth.trim()},body:{th:o.bth.trim(),en:o.ben.trim()||o.bth.trim()},by:S.user.id,at:nowStamp(),reviewed:true,reviewedBy:S.user.id});audit(`เผยแพร่บทเรียน ${o.tth.trim()}`,`Published lesson ${o.ten.trim()||o.tth.trim()}`);S.modal=null;render();toast(_('เผยแพร่บทเรียนแล้ว','Lesson published'))},
 phase:(o,fd,f)=>{const p=P(f.dataset.pid);const n=+o.phase;if(n===p.phase)return fail(f,_('เลือกช่วงที่ต่างจากช่วงปัจจุบัน','Pick a different stage'));if(!o.reason.trim())return fail(f,_('กรุณาระบุเหตุผลหรืออ้างอิงการยืนยัน','Enter a reason or confirmation reference'));
  const from=p.phase;p.phase=n;audit(`เปลี่ยนช่วงการรักษาจาก ${L(PHASES[from-1].title)} เป็น ${L(PHASES[n-1].title)} เหตุผล: ${o.reason.trim()}`,`Changed stage from ${PHASES[from-1].title.en} to ${PHASES[n-1].title.en}. Reason: ${o.reason.trim()}`,p.id);
  notify(p.id,`ทีมรักษาปรับช่วงการรักษาของคุณเป็น “${PHASES[n-1].title.th}”`,`Your care team moved you to “${PHASES[n-1].title.en}”`);render();toast(_('เปลี่ยนช่วงการรักษาแล้ว','Stage changed'))},
 critadd:(o,fd,f)=>{if(!o.th.trim())return fail(f,_('กรอกชื่ออาการภาษาไทย','Enter the Thai name'));D.criteria.push({id:uid('s'),level:o.level,name:{th:o.th.trim(),en:o.en.trim()||o.th.trim()}});D.settings.criteriaConfirmed=false;audit(`เพิ่มอาการ ${o.th.trim()} ในเกณฑ์ (${L(LEVELS[o.level].label)})`,`Added symptom ${o.en.trim()||o.th.trim()} (${LEVELS[o.level].label.en})`);render();toast(_('เพิ่มแล้ว ต้องยืนยันเกณฑ์อีกครั้ง','Added. Criteria need confirming again.'))},
 team:o=>{D.settings.teamPhone=o.phone.trim();D.settings.teamHours=o.hours.trim();audit('ปรับช่องทางติดต่อทีม','Updated team contact');render();toast(_('บันทึกช่องทางติดต่อแล้ว','Contact saved'))},
};
const CHG={
 rem:el=>{REM[el.dataset.k]=el.checked;saveRem();if(el.checked&&el.dataset.k==='sound')chime(1);if(el.checked&&el.dataset.k==='vib')buzz();render()},
 remlead:el=>{REM.lead=+el.value;saveRem()},
 perm:el=>{const c=D.consents.find(x=>x.id===el.dataset.cs);c.perms[el.dataset.k]=el.checked;const l=PERMS.find(p=>p[0]===el.dataset.k)[1];audit(`${el.checked?'อนุญาต':'ยกเลิกสิทธิ์'} “${l.th}” ให้ ${nameOf(c.caregiverId)}`,`${el.checked?'Allowed':'Removed'} “${l.en}” for ${L(C(c.caregiverId).name)}`,c.patientId);toast(_('อัปเดตสิทธิ์แล้ว','Access updated'))},
 chk:el=>{const p=P(el.dataset.pid);p.checklist[el.dataset.k]=el.checked;const [pk,ik]=el.dataset.k.split('.');const it=PHASES.find(x=>x.key===pk).items.find(i=>i[0]===ik)[1];audit(`${el.checked?'ทำเครื่องหมายเสร็จ':'ยกเลิกเครื่องหมาย'}: ${it.th}`,`${el.checked?'Checked':'Unchecked'}: ${it.en}`,p.id);render()},
 crit:el=>{const c=D.criteria.find(x=>x.id===el.dataset.id);c.level=el.value;const was=D.settings.criteriaConfirmed;D.settings.criteriaConfirmed=false;audit(`เปลี่ยนระดับ “${c.name.th}” เป็น ${LEVELS[el.value].label.th}`,`Set “${c.name.en}” to ${LEVELS[el.value].label.en}`);if(was)render();toast(_('บันทึกแล้ว ต้องยืนยันเกณฑ์อีกครั้ง','Saved. Criteria need confirming again.'))},
 labtest:el=>{if(!el)return;const t=LAB(el.value),prev=labsOf(el.dataset.pid,el.value).at(-1);const set=(id,v)=>{const x=document.getElementById(id);if(x)x.value=v??''};set('lb-unit',prev?.unit??t.unit);set('lb-low',prev?.refLow);set('lb-high',prev?.refHigh)},
};
document.addEventListener('click',e=>{
 const ov=e.target.classList?.contains('overlay')?e.target:null;
 if(ov){if(ov.dataset.close==='more')S.moreOpen=false;else S.modal=null;render();return}
 const el=e.target.closest('[data-a]');if(!el)return;const fn=ACT[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener('submit',e=>{const f=e.target,fn=FORMS[f.dataset.form];if(fn){e.preventDefault();const fd=new FormData(f);fn(Object.fromEntries(fd),fd,f)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&CHG[el.dataset.c])CHG[el.dataset.c](el)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.modal||S.moreOpen)){S.modal=null;S.moreOpen=false;render()}});
seed();render();
</script>
