<title>ตับดีมีสุข by LT CMU</title>
<meta name="theme-color" content="#3A8A86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" href="media/apple-touch-icon2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: app shell — fixed sidebar on desktop, top bar + bottom tab bar on phone; content column max 1180px.
   Direction: warm cream paper, leaf greens and Lanna gold; soft hills, a chedi and frangipani as the Chiang Mai motif; looped Thai body face for older readers. */
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --surface-2:#F3EFE5; --ink:#1E2B24; --ink-2:#5A6A60; --line:#E7E1D3;
  --brand:#2E6B4F; --brand-2:#235740; --brand-ink:#FFFFFF; --brand-soft:#E3EFE6; --leaf:#5E9E63; --leaf-soft:#EEF5EA;
  --gold:#96691A; --gold-2:#C9A048; --gold-ink:#FFFFFF; --info-ink:#FFFFFF; --gold-soft:#F7EDD7;
  --ok:#2C7A4B; --ok-soft:#E0F1E5; --ok-ink:#FFFFFF;
  --warn:#8A5A00; --warn-soft:#FBEBC8;
  --danger:#A3271E; --danger-soft:#FBE3DF; --danger-ink:#FFFFFF;
  --info:#3E5F8A; --info-2:#33507A; --info-soft:#E7EEF7;
  --hero-bg:#2E6B4F; --hero-ink:#FFFFFF; --hero-sub:#D4E7DA; --hero-gold:#E9C77E; --hero-track:rgba(255,255,255,.24);
  --hill1:#E6F0DE; --hill2:#D2E5CC; --hill3:#B9D6B5; --sky:#FBF6EA; --petal:#FFFFFF; --petal-c:#F3C25B; --chedi:#D2A750; --bld1:#FFFFFF; --bld2:#E4E8E3; --bld3:#D5DEDA; --win:#A9BDB8; --bld-edge:#C9D3CE;
  --scrim:rgba(24,32,26,.5); --shadow:0 1px 2px rgba(70,60,30,.05),0 10px 30px rgba(70,60,30,.07);
  --f-display:'Anuphan','IBM Plex Sans Thai Looped','Noto Sans Thai','Leelawadee UI',Thonburi,system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai Looped','Noto Sans Thai Looped','Noto Sans Thai','Leelawadee UI',Thonburi,system-ui,sans-serif;
  --f-script:'Caveat','Segoe Script','Bradley Hand',cursive;
  --r:20px; --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211C; --surface-2:#1F2B25; --ink:#E7EDE8; --ink-2:#A9B7AE; --line:#2B3832;
  --brand:#86CDA6; --brand-2:#9FDBB9; --brand-ink:#0C1A13; --brand-soft:#1C3A2D; --leaf:#8CC490; --leaf-soft:#1A2E22;
  --gold:#E1B866; --gold-2:#E9C77E; --gold-ink:#1A1306; --info-ink:#0B1520; --gold-soft:#342A17;
  --ok:#7AD09A; --ok-soft:#163423; --ok-ink:#0C1A13;
  --warn:#EAB64F; --warn-soft:#382B10;
  --danger:#F29086; --danger-soft:#3C1A17; --danger-ink:#1A0806;
  --info:#9BBCE3; --info-2:#B3CDEC; --info-soft:#17283B;
  --hero-bg:#1B4334; --hero-ink:#E9F1EC; --hero-sub:#A8C8B8; --hero-gold:#E1B866; --hero-track:rgba(255,255,255,.14);
  --hill1:#18261E; --hill2:#1D3026; --hill3:#24392D; --sky:#131C17; --petal:#E9E4D6; --petal-c:#D9A94A; --chedi:#B98F3E; --bld1:#3B4943; --bld2:#2E3A35; --bld3:#26312C; --win:#5E7169; --bld-edge:#4A5A53;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --surface-2:#1F2B25; --ink:#E7EDE8; --ink-2:#A9B7AE; --line:#2B3832;
  --brand:#86CDA6; --brand-2:#9FDBB9; --brand-ink:#0C1A13; --brand-soft:#1C3A2D; --leaf:#8CC490; --leaf-soft:#1A2E22;
  --gold:#E1B866; --gold-2:#E9C77E; --gold-ink:#1A1306; --info-ink:#0B1520; --gold-soft:#342A17;
  --ok:#7AD09A; --ok-soft:#163423; --ok-ink:#0C1A13;
  --warn:#EAB64F; --warn-soft:#382B10;
  --danger:#F29086; --danger-soft:#3C1A17; --danger-ink:#1A0806;
  --info:#9BBCE3; --info-2:#B3CDEC; --info-soft:#17283B;
  --hero-bg:#1B4334; --hero-ink:#E9F1EC; --hero-sub:#A8C8B8; --hero-gold:#E1B866; --hero-track:rgba(255,255,255,.14);
  --hill1:#18261E; --hill2:#1D3026; --hill3:#24392D; --sky:#131C17; --petal:#E9E4D6; --petal-c:#D9A94A; --chedi:#B98F3E; --bld1:#3B4943; --bld2:#2E3A35; --bld3:#26312C; --win:#5E7169; --bld-edge:#4A5A53;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark}
html.large{--fs:20px}

*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.45rem} h3{font-size:1.12rem} h4{font-size:1.02rem}
p{margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit}
small{font-size:.84rem}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 16px;overflow-y:auto}
.brand{padding:0 8px}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:42px;height:42px;flex:none}
.logo b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1;color:var(--brand);font-weight:700}
.logo span{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);font-family:var(--f-display)}
.lanna{display:block;width:100%;height:14px}
.nav{display:grid;gap:2px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border:0;background:none;border-radius:12px;cursor:pointer;text-align:left;font-weight:500;color:var(--ink-2);width:100%}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-i .badge{margin-left:auto}
.side-foot{margin-top:auto}
.ucard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2)}
.ucard>div{min-width:0}
.ucard b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard span{display:block;font-size:.8rem;color:var(--ink-2);line-height:1.35}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-family:var(--f-display);font-weight:600;flex:none}
.avatar.lg{width:60px;height:60px;font-size:1.5rem}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line)}
.tb-in{max-width:1180px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.tb-title{display:flex;align-items:center;gap:10px;min-width:0}
.tb-title h1{font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-mark{display:none;width:34px;height:34px;flex:none}
.tb-act{display:flex;align-items:center;gap:8px;flex:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:38px;min-width:42px;padding:0 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink-2);font-family:var(--f-display)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.seg.big{align-self:flex-start}
.seg.big button{min-height:46px;font-size:1rem;padding:0 18px}
.content{width:100%;max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.demo{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--gold);background:var(--gold-soft);border-radius:10px;padding:6px 12px;line-height:1.4}
.tabbar{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;min-height:58px;cursor:pointer;color:var(--ink-2);font-size:.74rem;font-weight:600;border-radius:12px;font-family:var(--f-display);padding:0 2px}
.tab .ic{width:26px;height:26px}
.tab.on{color:var(--brand);background:var(--brand-soft)}
@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .tb-mark{display:block}
  .tb-in,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tb-in{min-height:60px}
  .tb-title h1{font-size:1.12rem}
  .content{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
  .hide-sm{display:none!important}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h h3 .ic{color:var(--brand)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.sec-h{font-size:1.15rem}
.eyebrow{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:600;font-family:var(--f-display)}
.lead{color:var(--ink-2);max-width:62ch}
.row{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.ok:hover{border-color:var(--ok)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:40px;padding:0 12px;font-size:.9rem;border-radius:10px}
.btn.block{width:100%}
.btn.back{align-self:flex-start;margin-left:-8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);font-family:var(--f-display);line-height:1.6}
.chip .ic{width:1em;height:1em}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.ph1{background:var(--info-soft);color:var(--info)}
.ph2{background:var(--gold-soft);color:var(--gold)}
.ph3{background:var(--ok-soft);color:var(--ok)}
.ph4{background:var(--surface-2);color:var(--ink-2)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--warn);color:var(--surface);font-size:.75rem;font-weight:700;display:inline-grid;place-items:center;font-family:var(--f-display)}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);color:var(--ink);border-radius:14px;padding:14px 16px;line-height:1.55}
.notice .ic{color:var(--gold);margin-top:3px}
.notice.info{background:var(--info-soft)} .notice.info .ic{color:var(--info)}
.notice.ok{background:var(--ok-soft)} .notice.ok .ic{color:var(--ok)}
.lockline{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.5}
.lockline .ic{margin-top:2px}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:36px;height:36px;color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:5px}

/* forms */
.form{display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.fgrid .span2{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:.95rem;min-width:0}
.field small{color:var(--ink-2);font-weight:400}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--brand);flex:none}
.pair{display:flex;align-items:center;gap:6px}
.pair input{min-width:0}
.ferr{color:var(--danger);font-weight:600;font-size:.94rem}
.ferr:empty{display:none}
.hint{font-size:.88rem;color:var(--ink-2)}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;line-height:1.5}
.check input{margin-top:3px}
.sym-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.sym{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg);min-height:58px;line-height:1.4}
.sym:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:54px;border-bottom:1px solid var(--line);cursor:pointer}
.sw:last-child{border-bottom:0}
.sw input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;border:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked{background:var(--brand)}
.sw input:checked::after{transform:translateX(20px)}
.sw input:disabled{opacity:.4;cursor:not-allowed}

/* tables */
.tbl-wrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-family:var(--f-display);font-weight:600;font-size:.8rem;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td small{display:block;color:var(--ink-2)}
td.nw{white-space:nowrap}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:24px 24px 18px;display:flex;flex-direction:column;gap:18px}
.hero .eyebrow{color:var(--hero-gold)}
.hero-h{font-size:clamp(1.55rem,3.4vw,2.1rem);font-weight:700}
.hero-sub{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--hero-sub)}
.hero .chip{background:var(--hero-track);color:var(--hero-ink)}
.jmini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.jmini div{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--hero-sub);line-height:1.35;min-width:0}
.jmini i{display:block;height:6px;border-radius:3px;background:var(--hero-track)}
.jmini .done i{background:var(--hero-gold)}
.jmini .cur i{background:var(--hero-ink)}
.jmini .cur{color:var(--hero-ink);font-weight:600}
.hero .lanna{opacity:.9}
.notif{display:flex;align-items:center;gap:12px;background:var(--info-soft);border-radius:14px;padding:12px 14px}
.notif .ic{color:var(--info)}
.notif p{flex:1;min-width:0}
.menu-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.menu-i{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;font-family:var(--f-display);font-weight:600;min-height:110px}
.menu-i:hover{border-color:var(--brand)}
.menu-i .ic{width:28px;height:28px;color:var(--brand);padding:7px;background:var(--brand-soft);border-radius:10px;box-sizing:content-box}
.next-dose{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--surface-2);border-radius:12px}
.next-dose .time{font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--brand);font-variant-numeric:tabular-nums}
.quick{display:grid;gap:10px}
.quick .btn{justify-content:flex-start;min-height:60px;font-size:1.05rem}
.emerg{background:var(--danger-soft);border-color:transparent}
.emerg h3 .ic{color:var(--danger)}
.call{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.call a,.call .bignum{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1;color:var(--danger);text-decoration:none;font-variant-numeric:tabular-nums;user-select:all}

/* meds */
.doses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dose{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dose:last-child{border-bottom:0}
.dose .time{font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand)}
.dose-info{display:flex;flex-direction:column;min-width:0;line-height:1.45}
.dose-info span,.dose-info small{color:var(--ink-2)}
.dose-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:640px){.dose{grid-template-columns:58px minmax(0,1fr)}.dose-act{grid-column:1/-1;justify-content:flex-start}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.76rem;color:var(--ink-2)}

.wd.partial i{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.wd.empty i{border-style:dashed}

.wd.none i{opacity:.45}
.rx{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}

details.hist{border-top:1px solid var(--line)}

.rx-row{background:var(--bg)}

/* journey */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px}
.step-rail{display:flex;flex-direction:column;align-items:center}
.step-n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none}
.step.done .step-n{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.step.cur .step-n{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px var(--brand-soft)}
.step-line{flex:1;width:2px;background:var(--line);margin:6px 0;min-height:16px}
.step.done .step-line{background:var(--brand)}
.step:last-child .step-line{display:none}
.step-body{padding-bottom:24px;display:flex;flex-direction:column;gap:10px;min-width:0;padding-top:6px}
.step-body h3{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.step-code{font-size:.72rem;letter-spacing:.14em;color:var(--ink-2);font-family:var(--f-display);font-weight:600}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.clist label{cursor:pointer}
.tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:2px}
.tick .ic{width:14px;height:14px;stroke-width:3}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}

/* records */
.trend{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.trend>div{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.trend b{font-family:var(--f-display);font-size:1.5rem;line-height:1.15;font-variant-numeric:tabular-nums}
.trend b small{font-size:.8rem;color:var(--ink-2);font-weight:500;margin-left:4px}
.trend span{font-size:.85rem;color:var(--ink-2)}
.spark{display:block;width:100%;height:34px}
.spark-a{fill:var(--brand-soft);stroke:none}
.spark-l{fill:none;stroke:var(--brand);stroke-width:2;vector-effect:non-scaling-stroke}
.spark-d{fill:var(--brand)}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.slist>li{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.slist>li:last-child{border-bottom:0}
.level{border-radius:16px;padding:18px;display:flex;gap:14px;align-items:flex-start}
.level>.ic{width:32px;height:32px;margin-top:2px}
.level h3{font-size:1.25rem}
.level.ok{background:var(--ok-soft)} .level.ok>.ic{color:var(--ok)}
.level.warn{background:var(--warn-soft)} .level.warn>.ic{color:var(--warn)}
.level.danger{background:var(--danger-soft)} .level.danger>.ic{color:var(--danger)}
.level.none{background:var(--surface-2)} .level.none>.ic{color:var(--brand)}
.level div{display:flex;flex-direction:column;gap:8px;min-width:0}

/* appts */
.appts{list-style:none;margin:0;padding:0}
.appt{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.appt:last-child{border-bottom:0}
.dblock{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:var(--brand-soft);color:var(--brand);padding:10px 4px;height:fit-content;line-height:1.2}
.dblock b{font-family:var(--f-display);font-size:1.75rem;line-height:1}
.dblock span{font-size:.76rem;font-weight:600;font-family:var(--f-display)}
.appt.past .dblock{background:var(--surface-2);color:var(--ink-2)}
.appt-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.prep{font-size:.94rem;background:var(--surface-2);border-radius:10px;padding:8px 12px}

/* staff */
.stat{display:flex;flex-direction:column;gap:2px;padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:2rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-2);font-size:.9rem}
.stat.warn b{color:var(--warn)}
.pt-list{display:flex;flex-direction:column;gap:10px}
.pt{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.3fr) 24px;gap:14px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.pt:hover{border-color:var(--brand)}
.pt>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.pt small{color:var(--ink-2)}
.pt .ic.chev{color:var(--ink-2)}
@media (max-width:760px){.pt{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pt .chev{display:none}}
.pt-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pt-head>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;min-height:48px;font-family:var(--f-display);font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.qrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow>div{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 300px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 3.6rem;gap:12px;align-items:center;font-size:.92rem}
.bar-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:7px;min-width:2px}
.fill.warn{background:var(--warn)} .fill.danger{background:var(--danger)} .fill.ok{background:var(--ok)} .fill.info{background:var(--info)}
@media (max-width:560px){.bar-row{grid-template-columns:minmax(0,1fr) 3.4rem}.bar-row .track{grid-column:1/-1;grid-row:2}}
.topic{display:flex;flex-direction:column;gap:10px}
.art{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;font-weight:600}
.art:hover{border-color:var(--brand)}
.article-body p{margin:0 0 12px;max-width:65ch}
.article-body h3{margin:18px 0 6px;font-size:1.08rem}
.article-body ul,.article-body ol{margin:0 0 12px;padding-left:1.3em;display:grid;gap:6px;max-width:65ch}
.art>span:first-child{display:flex;gap:8px;align-items:center;min-width:0;flex:1}
.art .ic{color:var(--brand)}
.art.vid{font-weight:500}
.vgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.poster{position:relative;display:block;width:100%;max-width:100%;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:var(--surface-2)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.play .ic{width:26px;height:26px;fill:currentColor;margin-left:3px}
.poster:hover .play{transform:scale(1.06)}
.dur{position:absolute;right:10px;bottom:10px;background:var(--scrim);color:var(--hero-ink);font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:6px;font-family:var(--f-display)}
.chap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.chap-b{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;line-height:1.45}

.chap-b.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.chap-b .num{color:var(--brand);font-weight:600;font-family:var(--f-display);min-width:3.2em;flex:none}
.player{width:100%;aspect-ratio:16/9;border-radius:12px;background:var(--surface-2);display:block}
.modal.wide{max-width:780px}

/* login */
.login{min-height:100vh;display:flex;justify-content:center;padding-block:32px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-in{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:22px}
.login-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.login-h{font-size:clamp(1.75rem,4.2vw,2.7rem);max-width:21ch;color:var(--brand);font-weight:700;line-height:1.25}
.acc-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.acc{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}

.roles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.roles>div{display:flex;flex-direction:column;gap:4px}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:600px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}

@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s;line-height:1.45}
#toast.show{opacity:1}
@media (max-width:899px){#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}

/* ---------- v3 visual layer: cream paper, leaf greens, Lanna gold ---------- */

/* landscape emblem */
.scene{display:block;width:100%;height:auto}

/* login / landing */
.lg{min-height:100vh;background:radial-gradient(1100px 520px at 85% -10%,var(--gold-soft),transparent 60%),radial-gradient(900px 600px at -10% 30%,var(--leaf-soft),transparent 60%),var(--bg)}
.lg-in{max-width:1180px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}

.c-green{--c:var(--brand);--cs:var(--brand-soft)} .c-leaf{--c:var(--ok);--cs:var(--leaf-soft)} .c-blue{--c:var(--info);--cs:var(--info-soft)}

.jrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

const GUIDE={th:'แนวปฏิบัติทางคลินิกสำหรับการเตรียมความพร้อมของผู้ป่วยก่อนผ่าตัดปลูกถ่ายตับ ทีมปลูกถ่ายตับ คณะแพทยศาสตร์ มหาวิทยาลัยเชียงใหม่ (2569)',en:'Clinical practice guideline for preparing patients before liver transplantation, Liver Transplant Team, Faculty of Medicine, Chiang Mai University (2026)'};

{id:'e1',topic:'t-about',src:srcP('13–15'),title:{th:'ใครบ้างที่ควรได้รับการปลูกถ่ายตับ',en:'Who needs a liver transplant?'},body:{
th:`การปลูกถ่ายตับจะพิจารณาเมื่อตับทำงานล้มเหลวจนฟื้นกลับไม่ได้ หรือเป็นมะเร็งตับ และการรักษาด้วยยาหรือวิธีมาตรฐานอื่นไม่ได้ผลแล้ว
## 3 กลุ่มหลักที่ทีมแพทย์พิจารณา
- **โรคตับระยะสุดท้ายที่มีอาการตับทรุด** เช่น ท้องมาน (มีน้ำในช่องท้อง) สับสนหรือซึมจากโรคตับ หรือเลือดออกจากเส้นเลือดขอดในหลอดอาหารหรือกระเพาะอาหาร ทีมแพทย์ใช้คะแนน MELD-Na ซึ่งคำนวณจากค่าไต ค่าการแข็งตัวของเลือด ค่าดีซ่าน และค่าโซเดียม หากคะแนนตั้งแต่ 15 ขึ้นไป ประโยชน์จากการปลูกถ่ายมักสูงกว่าความเสี่ยง
- **มะเร็งเซลล์ตับ** ที่อยู่ในเกณฑ์ Milan คือ ก้อนเดียวขนาดไม่เกิน 5 ซม. หรือไม่เกิน 3 ก้อนและแต่ละก้อนไม่เกิน 3 ซม. โดยไม่ลุกลามเข้าเส้นเลือดหรือออกนอกตับ บางรายที่เกินเกณฑ์อาจรักษาให้ลดระยะลงมาก่อนได้
- **ภาวะตับวายเฉียบพลัน** คือตับเสียหน้าที่อย่างรุนแรงและรวดเร็ว ในผู้ที่ไม่เคยเป็นโรคตับเรื้อรังมาก่อน
## ทำไมจังหวะเวลาจึงสำคัญ
ถ้าส่งตัวช้าเกินไป อาการอาจทรุดหนักหรือมะเร็งลุกลามจนผ่าตัดไม่ได้ ถ้าเร็วเกินไปในช่วงที่ตับแข็งยังไม่มีอาการ ความเสี่ยงจากการผ่าตัดอาจสูงกว่าตัวโรค ทีมแพทย์จึงประเมินเพื่อหาช่วงเวลาที่เหมาะสมที่สุดของแต่ละคน`,
en:`A liver transplant is considered when the liver has failed and cannot recover, or when there is liver cancer, and medicines or other standard treatments no longer work.
## Three main groups
- **End-stage liver disease with decompensation**, such as fluid in the belly (ascites), confusion caused by liver disease, or bleeding from swollen veins in the food pipe or stomach. Doctors use the MELD-Na score, worked out from kidney, clotting, jaundice and sodium results. At 15 or above, the benefit of a transplant usually outweighs the risk.
- **Liver cell cancer (HCC)** within the Milan criteria: one tumour up to 5 cm, or up to 3 tumours each up to 3 cm, with no spread into blood vessels or outside the liver. Some people beyond these limits can be treated first to bring the cancer back within them.
- **Acute liver failure**: the liver suddenly and severely stops working in someone without earlier chronic liver disease.
## Why timing matters
Referred too late, a person may become too ill, or the cancer may spread, so surgery is no longer possible. Too early, while cirrhosis causes no symptoms, the surgery may carry more risk than the disease. The team looks for the right time for each person.`}},
{id:'e2',topic:'t-prep',src:srcP('9–10, 15–16'),title:{th:'การตรวจประเมินก่อนขึ้นทะเบียนรอปลูกถ่าย',en:'Assessments before joining the waiting list'},body:{
th:`ก่อนขึ้นทะเบียนรอปลูกถ่ายตับ ทีมสหสาขาวิชาชีพจะประเมินคุณหลายด้าน เพื่อให้แน่ใจว่าร่างกายและจิตใจพร้อมสำหรับการผ่าตัดใหญ่ และเพื่อค้นหาปัญหาที่แก้ไขได้ก่อนผ่าตัด
## การตรวจทั่วไป
- ซักประวัติการเจ็บป่วย การผ่าตัด และการแพ้ยา พร้อมตรวจร่างกายอย่างละเอียด
- ตรวจเลือด เช่น ความสมบูรณ์ของเลือด ค่าไต ค่าตับ การแข็งตัวของเลือด หมู่เลือด ไวรัสตับอักเสบ และการติดเชื้ออื่น ๆ
- ตรวจอุจจาระ 3 วันติดต่อกัน
- เอกซเรย์ปอด คลื่นไฟฟ้าหัวใจ และ CT หรือ MRI ช่องท้อง เพื่อดูโครงสร้างตับและเส้นเลือด
## การประเมินเฉพาะด้าน 7 ด้าน
1. **ด้านจิตใจ** โดยทีมจิตเวชศาสตร์ประสานงาน
2. **หัวใจและหลอดเลือด** อย่างน้อยตรวจคลื่นไฟฟ้าหัวใจและอัลตราซาวด์หัวใจ โดยอายุรแพทย์โรคหัวใจ
3. **การติดเชื้อ** ตรวจหาเชื้อแอบแฝงและฉีดวัคซีนให้ครบ
4. **ทางเดินอาหารและตับ** ส่องกล้องทางเดินอาหารส่วนต้นเพื่อหาเส้นเลือดขอด และส่องกล้องลำไส้ใหญ่ตามวัยหรือข้อบ่งชี้
5. **ปอดและทางเดินหายใจ** เช่น ตรวจสมรรถภาพปอด
6. **มะเร็งนอกตับ** คัดกรองตามวัย เช่น แมมโมแกรม ตรวจมะเร็งปากมดลูก และตรวจเลือดในอุจจาระ
7. **ด้านอื่น ๆ** ตรวจสุขภาพฟัน พบนักสังคมสงเคราะห์ นักโภชนากร และนักกายภาพบำบัด
## หลังประเมินครบ
ทีมสหสาขาวิชาชีพจะประชุมร่วมกันเพื่อพิจารณาความพร้อมก่อนขึ้นทะเบียน ระหว่างรอ คุณจะได้รับนัดตรวจติดตามทุก 6–8 สัปดาห์ ดูความคืบหน้าของแต่ละรายการได้ที่เมนู “เส้นทางการรักษา”`,
en:`Before you join the waiting list, a multidisciplinary team checks many areas to make sure your body and mind are ready for major surgery, and to find problems that can be fixed first.
## General tests
- Your medical, surgical and allergy history, and a full physical examination
- Blood tests such as blood count, kidney and liver function, clotting, blood group, hepatitis viruses and other infections
- Stool tests on 3 days in a row
- Chest X-ray, ECG, and abdominal CT or MRI to see the liver and its blood vessels
## Seven specialist assessments
1. **Emotional and social** by the liaison psychiatry team
2. **Heart and blood vessels**, at least an ECG and heart ultrasound, by a cardiologist
3. **Infection**: hidden infections and catching up on vaccines
4. **Gut and liver**: upper endoscopy to look for swollen veins, and colonoscopy by age or need
5. **Lungs**, such as a lung function test
6. **Other cancers**: age-based screening such as mammogram, cervical screening and stool blood test
7. **Other**: dental check, social worker, dietitian and physiotherapist
## After the assessments
The team meets to decide whether you are ready to be listed. While you wait, you will have check-ups every 6–8 weeks. Track each step under “My journey”.`}},
{id:'e3',topic:'t-prep',src:srcP('25–26, 28'),title:{th:'วัคซีนก่อนปลูกถ่ายตับ',en:'Vaccines before transplant'},body:{
th:`หลังปลูกถ่าย คุณจะได้รับยากดภูมิคุ้มกันไปตลอด การติดเชื้อจึงเป็นสาเหตุสำคัญของการเสียชีวิตหลังผ่าตัด การฉีดวัคซีนให้ครบตั้งแต่ก่อนผ่าตัดเป็นทางเลือกที่ดีที่สุดและให้ภูมิคุ้มกันดีที่สุด
- **วัคซีนชนิดเชื้อตาย** เช่น วัคซีนไข้หวัดใหญ่ประจำปี วัคซีนปอดอักเสบ และวัคซีนโควิด-19 ฉีดได้อย่างปลอดภัยทั้งก่อนและหลังปลูกถ่าย
- **วัคซีนชนิดเชื้อเป็น** ห้ามฉีดหลังปลูกถ่าย ถ้าจำเป็นต้องฉีดก่อนผ่าตัด ต้องเว้นระยะห่างจากวันผ่าตัดอย่างน้อย 4 สัปดาห์
- หลังปลูกถ่ายแล้ว ต้องรออย่างน้อย 12 สัปดาห์ (3 เดือน) จึงเริ่มฉีดวัคซีนได้
- ไวรัสตับอักเสบบีมีวัคซีนป้องกันที่ได้ผลดีมาก ส่วนไวรัสตับอักเสบซียังไม่มีวัคซีน แต่ปัจจุบันมียารักษาที่ได้ผลดีมาก
ทุกครั้งที่จะฉีดวัคซีนที่สถานพยาบาลใด ให้แจ้งว่าคุณรอหรือได้รับการปลูกถ่ายตับ และถามทีมปลูกถ่ายก่อนเสมอ`,
en:`After a transplant you will take medicines that lower your immunity for life, and infection is a leading cause of death after surgery. Getting your vaccines before surgery gives the best protection.
- **Non-live vaccines**, such as the yearly flu vaccine, pneumococcal vaccine and COVID-19 vaccine, are safe before and after transplant.
- **Live vaccines** must not be given after transplant. If one is needed before surgery, it must be at least 4 weeks before the operation.
- After transplant, wait at least 12 weeks (3 months) before starting vaccines.
- Hepatitis B has a very effective vaccine. Hepatitis C has no vaccine yet, but very effective treatment.
Wherever you are vaccinated, say that you are waiting for or have had a liver transplant, and always check with the transplant team first.`}},
{id:'e4',topic:'t-prep',src:srcP('34–37'),title:{th:'ดูแลสุขภาพฟันก่อนปลูกถ่าย',en:'Dental care before transplant'},body:{
th:`หลังปลูกถ่าย ภูมิคุ้มกันจะต่ำมาก การติดเชื้อเล็กน้อยในช่องปากอาจลุกลามเป็นการติดเชื้อในกระแสเลือดที่อันตรายได้ และในช่วงเดือนแรก ๆ หลังผ่าตัดจะทำฟันไม่ได้ ยกเว้นกรณีฉุกเฉิน
## ทันตแพทย์จะทำอะไรบ้าง
- ตรวจช่องปากและเอกซเรย์ทั้งปาก เพื่อหารอยโรคที่มองไม่เห็น เช่น ถุงน้ำที่ปลายรากฟัน หรือฟันคุดที่อักเสบ
- ขูดหินปูน รักษาเหงือกอักเสบ และอุดฟันผุ
- รักษารากฟันเฉพาะซี่ที่มีโอกาสหายดี
- ถอนฟันที่มีปัญหาเรื้อรังหรือเสี่ยงอักเสบซ้ำ ดีกว่าเก็บไว้แล้วเสี่ยงติดเชื้อหลังผ่าตัด
## สิ่งที่คุณควรทำ
- รีบทำฟันให้เสร็จ **อย่างน้อย 2–4 สัปดาห์ก่อนผ่าตัด** เพื่อให้แผลในปากหายสนิท
- แจ้งทันตแพทย์ทุกครั้งว่าเป็นโรคตับ เพราะเลือดอาจออกง่ายและหยุดยาก ทันตแพทย์จะตรวจค่าการแข็งตัวของเลือดและเกล็ดเลือดก่อนถอนฟัน
- อย่าซื้อยาแก้ปวดกินเอง ยากลุ่ม NSAIDs โดยทั่วไปห้ามใช้ในผู้ป่วยตับแข็ง เพราะเสี่ยงเลือดออกในทางเดินอาหารและไตเสื่อม ส่วนพาราเซตามอลให้ใช้ตามขนาดที่แพทย์หรือทันตแพทย์แนะนำ และนับรวมยาสูตรผสมที่มีพาราเซตามอลด้วย`,
en:`After transplant your immunity will be very low. A small mouth infection can spread into the blood, and dental work is not possible in the first months after surgery except in emergencies.
## What the dentist does
- Examines your mouth and takes a full-mouth X-ray to find hidden problems such as root cysts or inflamed wisdom teeth
- Cleans tartar, treats gum disease and fills decay
- Does root canal treatment only on teeth likely to heal well
- Removes teeth with long-term problems, rather than risk infection after surgery
## What you should do
- Finish dental treatment **at least 2–4 weeks before surgery** so your mouth heals fully
- Always tell the dentist you have liver disease: you may bleed easily, so they will check clotting and platelets before extractions
- Don’t buy painkillers yourself. NSAIDs are generally not allowed with cirrhosis because of gut bleeding and kidney risk. Take paracetamol only as advised, and count combination products that contain it.`}},
{id:'e5',topic:'t-foodwait',src:srcP('9, 38–39'),title:{th:'อาหารระหว่างรอปลูกถ่ายตับ',en:'Eating well while you wait'},body:{
th:`ผู้ป่วยโรคตับระยะสุดท้ายมักขาดสารอาหารและกล้ามเนื้อลีบ ซึ่งทำให้ฟื้นตัวหลังผ่าตัดได้ช้า ระหว่างรอปลูกถ่าย **อย่าจำกัดอาหารมากเกินไป** เป้าหมายคือได้พลังงานและโปรตีนเพียงพอ รักษากล้ามเนื้อ คุมเกลือ และป้องกันการติดเชื้อจากอาหาร นักโภชนากรจะประเมินและปรับแผนให้เหมาะกับคุณเป็นระยะ
## โปรตีนให้เพียงพอ
- ผู้ป่วยรอปลูกถ่ายตับต้องการโปรตีนมากกว่าคนทั่วไป โดยทั่วไปประมาณ 1.2–1.5 กรัมต่อน้ำหนักตัว 1 กิโลกรัมต่อวัน นักโภชนากรจะบอกปริมาณที่เหมาะกับคุณ
- เลือกปลา ไก่ เนื้อสัตว์ไม่ติดมัน ไข่ขาว นมไขมันต่ำ และเต้าหู้
## พลังงาน ไขมัน และเกลือ
- ข้าวกล้อง ขนมปังโฮลวีต และธัญพืชไม่ขัดสี เป็นแหล่งพลังงานหลัก
- เลี่ยงของทอดและแกงกะทิ ใช้น้ำมันไม่เกินประมาณ 2 ช้อนชาต่อมื้อ
- ถ้ามีท้องมาน บวม หรือความดันโลหิตสูง จำกัดโซเดียมไม่เกิน 2,000 มก. ต่อวัน หรือเกลือประมาณ 1 ช้อนชาต่อวัน
- กินให้ครบ 5 หมู่ เลี่ยงอาหารหวานจัด มันจัด และอาหารแปรรูป
## อาหารที่ต้องงด
- **งดเด็ดขาด** อาหารดิบหรือกึ่งสุกกึ่งดิบ ปลาดิบ หอยดิบ ลาบดิบ ก้อย ไข่ดิบ และเครื่องดื่มแอลกอฮอล์ทุกชนิด
- **ควรเลี่ยง** อาหารหมักดอง รมควัน ตากแห้ง แปรรูป ปิ้งย่างไหม้เกรียม และสมุนไพรหรือยาต้มที่ไม่ทราบส่วนประกอบ
## ป้องกันการติดเชื้อจากอาหาร
- ล้างมือก่อนกินทุกครั้ง กินอาหารปรุงสุกใหม่ ดื่มน้ำสะอาด
- ล้างผักผลไม้ให้สะอาด เลือกวัตถุดิบจากแหล่งที่เชื่อถือได้ และเลี่ยงอาหารค้างคืน
ถ้ากินได้น้อย อาหารเสริมทางการแพทย์ช่วยได้ แต่ควรปรึกษาแพทย์หรือนักกำหนดอาหารก่อน`,
en:`People with end-stage liver disease are often undernourished and lose muscle, which slows recovery after surgery. While you wait, **don’t cut back on food too much**. The aim is enough energy and protein, keeping your muscles, limiting salt and avoiding food infections. The dietitian will review your plan regularly.
## Enough protein
- You need more protein than most people, usually about 1.2–1.5 g per kg of body weight per day. Your dietitian will set your amount.
- Choose fish, chicken, lean meat, egg whites, low-fat milk and tofu.
## Energy, fat and salt
- Brown rice, wholemeal bread and whole grains are your main energy sources.
- Avoid fried food and coconut-milk curries; use no more than about 2 teaspoons of oil per meal.
- With ascites, swelling or high blood pressure, keep sodium under 2,000 mg a day, about 1 teaspoon of salt.
- Eat from all 5 food groups and avoid very sweet, fatty or processed food.
## Foods to avoid
- **Never**: raw or half-cooked food, raw fish, raw shellfish, raw larb, koi, raw eggs, and any alcohol
- **Avoid**: pickled, smoked, dried and processed food, charred grilled food, and herbal remedies of unknown content
## Preventing food infections
- Wash your hands before eating, eat freshly cooked food and drink clean water
- Wash fruit and vegetables, buy from trusted sources, and avoid leftovers
If you can only eat a little, medical nutrition drinks can help, but ask your doctor or dietitian first.`}},
{id:'e6',topic:'t-body',src:srcP('40–44'),title:{th:'เตรียมร่างกายก่อนผ่าตัด (Prehab)',en:'Getting your body ready (prehab)'},body:{
th:`หลังผ่าตัดใหญ่ สมรรถภาพร่างกายจะลดลงทุกคน ถ้าก่อนผ่าตัดร่างกายแข็งแรงกว่า แม้จะลดลงเท่ากันก็ยังเหลือพอให้ลุก นั่ง เดิน และหายใจได้ดี และฟื้นตัวได้เร็วกว่า นักกายภาพบำบัดจะจัดโปรแกรมให้เหมาะกับคุณ ไม่มีสูตรเดียวที่ใช้ได้กับทุกคน
## ฝึกหายใจ
- **หายใจด้วยกระบังลม** วางมือที่ท้อง หายใจเข้าทางจมูกช้า ๆ ให้ท้องป่อง แล้วหายใจออกทางปากช้า ๆ
- **ขยายทรวงอก** วางมือที่ชายโครง แล้วหายใจเข้าให้ซี่โครงดันมือออก
- **ยืดทรวงอก** นั่งเก้าอี้ ยกแขนเหนือศีรษะพร้อมหายใจเข้า เอนตัวไปด้านข้าง แล้วก้มตัวพร้อมหายใจออก
ฝึกให้คล่องตั้งแต่ก่อนผ่าตัด เพราะหลังผ่าตัดอาจปวดแผลหน้าท้อง
## ใช้เครื่องบริหารปอด (incentive spirometer)
1. นั่งตัวตรง ถือเครื่องตั้งตรง อมปากเป่าให้สนิท
2. หายใจเข้าช้าและลึก ให้ทรวงอกส่วนล่างขยายก่อน ไม่ยกไหล่ ดูลูกสูบให้ขึ้นถึงขีดเป้าหมาย
3. กลั้นหายใจค้างไว้ 2–3 วินาที หรือนานได้ถึง 5–10 วินาที ขั้นตอนนี้สำคัญที่สุด
4. เอาปากออก หายใจออกช้า ๆ ทำครบ 10 ครั้ง แล้วไอขับเสมหะ
งดใช้และแจ้งทีมเมื่อมีการติดเชื้อทางเดินหายใจ ไอเป็นเลือด คลื่นไส้อาเจียน ปวดมาก หรือสับสน
## ออกกำลังกายและฝึกเคลื่อนไหว
- กระดกข้อเท้าขึ้นลงบ่อย ๆ และขยับข้อทุกข้อให้สุดช่วง
- ออกกำลังต้านแรง เริ่มจากน้ำหนักเบา เช่น 500 กรัม ท่าละ 5–10 ครั้ง แล้วค่อยเพิ่มตามที่ทนได้
- เดินหรือปั่นจักรยานครั้งละ 10–15 นาทีขึ้นไป ให้รู้สึกเหนื่อยระดับ 3–6 จาก 10
- ฝึกทรงตัวทั้งท่านั่งและยืน
- ฝึกลุกจากเตียงโดยตะแคงตัวก่อน แล้วดันตัวขึ้นนั่งข้างเตียง ช่วยลดแรงดึงที่หน้าท้อง
## ข้อควรระวัง
- ห้ามกลั้นหายใจเบ่งขณะออกแรง ให้หายใจออกขณะออกแรงเสมอ
- ถ้ามีเส้นเลือดขอดในหลอดอาหาร เลี่ยงการยกของหนัก
- ระวังการล้มและการกระแทก โดยเฉพาะเมื่อเกล็ดเลือดต่ำหรือมีอาการสับสน
- **หยุดออกกำลังทันที** ถ้าตัวเขียวหรือซีด เจ็บหน้าอก เวียนศีรษะ เดินเซ หรือจะเป็นลม
- แจ้งโรคประจำตัวและอาการของคุณให้นักกายภาพทราบทุกครั้ง`,
en:`Everyone loses fitness after major surgery. If you start fitter, you still have enough left to sit up, walk and breathe well afterwards, and you recover faster. Your physiotherapist will tailor a programme for you; there is no one plan for everyone.
## Breathing exercises
- **Belly breathing**: hand on your belly, breathe in slowly through your nose so your belly rises, then out slowly through your mouth
- **Rib expansion**: hands on your lower ribs, breathe in so your ribs push your hands out
- **Chest stretch**: sitting, raise your arms overhead as you breathe in, lean to the side, then bend forward as you breathe out
Practise before surgery, because your belly wound may hurt afterwards.
## Using the incentive spirometer
1. Sit up straight, hold the device upright and seal your lips around the mouthpiece
2. Breathe in slowly and deeply, lower chest first, without lifting your shoulders, until the piston reaches the target
3. Hold your breath for 2–3 seconds, or up to 5–10 seconds. This is the most important step.
4. Remove the mouthpiece, breathe out slowly. Do 10 times, then cough to clear phlegm.
Stop and tell the team if you have a chest infection, cough up blood, feel sick, are in a lot of pain or confused.
## Exercise and movement
- Pump your ankles often and move every joint through its full range
- Strength exercise: start light, such as 500 g, 5–10 times per exercise, and build up as you can
- Walk or cycle for 10–15 minutes or more, at an effort of 3–6 out of 10
- Practise balance sitting and standing
- Get out of bed by rolling onto your side first, then pushing up to sit; this protects your belly
## Safety
- Never hold your breath and strain; breathe out as you push
- With varices in your food pipe, avoid heavy lifting
- Take care not to fall or knock yourself, especially with low platelets or confusion
- **Stop at once** if you turn blue or pale, get chest pain, feel dizzy, unsteady or faint
- Always tell your physiotherapist about your conditions and symptoms`}},
{id:'e7',topic:'t-mindprep',src:srcP('9–12, 16–19'),title:{th:'ความพร้อมด้านจิตใจก่อนปลูกถ่าย',en:'Emotional readiness before transplant'},body:{
th:`ความกังวลและความเครียดระหว่างรอปลูกถ่ายเป็นเรื่องปกติ ความกังวลระดับเล็กน้อยถึงปานกลางช่วยให้ตื่นตัวและเตรียมตัวได้ดี แต่ถ้ามากจนควบคุมไม่ได้ ควรได้รับความช่วยเหลือ
## การประเมินโดยทีมจิตเวชศาสตร์ประสานงาน
ผู้ป่วยทุกรายจะได้พบทีมก่อนขึ้นทะเบียน เพื่อพูดคุยใน 4 เรื่อง
- จิตใจ วิธีรับมือกับปัญหา แรงจูงใจในการผ่าตัด และการรักษาที่ผ่านมา
- ผู้ดูแลหลักและผู้ดูแลสำรอง สิทธิการรักษา และค่าใช้จ่าย
- ความเข้าใจขั้นตอนและความเสี่ยงของการผ่าตัด และความพร้อมในการให้ความยินยอม
- ปัจจัยที่อาจต้องแก้ไขก่อน เช่น การใช้สุราหรือสารเสพติด
การป่วยทางจิตเวชไม่ใช่ข้อห้ามเด็ดขาด ทีมจะมองภาพรวมและหาทางแก้ไขปัจจัยที่ปรับได้ร่วมกับคุณ และดูแลต่อเนื่องทั้งก่อน ระหว่าง และหลังผ่าตัด
## สุรา บุหรี่ และสารเสพติด
- ผู้ที่เคยดื่มสุราต้องหยุดดื่มอย่างเด็ดขาดอย่างน้อย 6 เดือน และผ่านการประเมินหรือบำบัดจากจิตแพทย์ก่อนพิจารณาปลูกถ่าย
- งดบุหรี่และสารเสพติดทุกชนิด
## สิ่งที่ช่วยได้
- เข้ากลุ่มผู้ป่วยที่รอหรือได้รับการปลูกถ่ายแล้ว เพื่อแลกเปลี่ยนประสบการณ์และความรู้สึก
- บอกทีมเมื่อรู้สึกเศร้า สิ้นหวัง นอนไม่หลับ หรือกังวลมาก ทีมมีผู้เชี่ยวชาญที่ช่วยได้`,
en:`Worry and stress while waiting are normal. Mild to moderate worry keeps you alert and helps you prepare, but if it becomes overwhelming, you should get help.
## Assessment by the liaison psychiatry team
Everyone meets the team before being listed, to talk about four things:
- Your feelings, how you cope, why you want the operation, and your past treatment
- Your main and backup caregiver, your healthcare coverage and costs
- How well you understand the steps and risks, and whether you are ready to give consent
- Things that may need to change first, such as alcohol or drug use
A mental health condition is not an automatic barrier. The team looks at the whole picture, works with you on what can change, and supports you before, during and after surgery.
## Alcohol, smoking and drugs
- Anyone who has drunk alcohol must stop completely for at least 6 months and be assessed or treated by a psychiatrist before a transplant is considered
- Stop smoking and all drug use
## What helps
- Join a group of people waiting for or living after a transplant to share experience
- Tell the team if you feel low, hopeless, can’t sleep or are very anxious; there are specialists who can help`}},
{id:'e8',topic:'t-family',src:srcP('17, 39–40'),title:{th:'ผู้ดูแลและการพบนักสังคมสงเคราะห์',en:'Caregivers and the social worker'},body:{
th:`การปลูกถ่ายตับต้องมีผู้ดูแลที่ช่วยเหลือได้ต่อเนื่อง ทั้งพามาตามนัด ดูแลเรื่องยา และช่วยในช่วงพักฟื้น นักสังคมสงเคราะห์จะช่วยวางแผนเรื่องนี้กับครอบครัว
## นักสังคมสงเคราะห์จะพูดคุยเรื่อง
- โครงสร้างครอบครัว ผู้หารายได้หลัก และผู้ตัดสินใจเรื่องการรักษา
- **ผู้ดูแลหลักและผู้ดูแลสำรอง** เวลาและความสามารถในการดูแล การพามาตามนัด
- อาชีพ รายได้ รายจ่าย หนี้สิน เงินออม และสิทธิการรักษา
- ความเข้าใจ ความเชื่อ และความกังวลของครอบครัวต่อการปลูกถ่าย
- เครือข่ายช่วยเหลือ เช่น ญาติ ชุมชน องค์กรปกครองส่วนท้องถิ่น หน่วยงานรัฐ และกองทุนช่วยเหลือผู้ป่วย
## การเยี่ยมบ้าน
อาจมีการเยี่ยมบ้านหรือประสานหน่วยงานในพื้นที่ เพื่อดูความสะอาด ความปลอดภัย และความเหมาะสมของบ้านสำหรับพักฟื้นหลังผ่าตัด
## ถ้ามีปัญหาค่าใช้จ่าย
แจ้งนักสังคมสงเคราะห์ได้ตั้งแต่เนิ่น ๆ จะช่วยประสานสิทธิการรักษา กองทุนช่วยเหลือค่าใช้จ่าย และหน่วยงานที่เกี่ยวข้อง รวมถึงให้คำปรึกษาด้านจิตใจแก่ครอบครัว`,
en:`A liver transplant needs a caregiver who can help over the long term: bringing you to appointments, helping with medicines and supporting your recovery. The social worker plans this with your family.
## The social worker will talk about
- Your family set-up, the main earner and who makes treatment decisions
- **Your main and backup caregiver**, their time and ability to care and to bring you to visits
- Work, income, expenses, debts, savings and healthcare coverage
- Your family’s understanding, beliefs and worries about transplantation
- Sources of support such as relatives, community, local government, public agencies and patient funds
## Home visit
There may be a home visit, or the team may ask local services to check that your home is clean, safe and suitable for recovery.
## If cost is a worry
Tell the social worker early. They can help with your healthcare rights, funds for costs and related agencies, and offer emotional support to your family.`}},
{id:'e9',topic:'t-wait',src:srcP('16, 44–47'),title:{th:'ระหว่างรอปลูกถ่าย ต้องสังเกตอะไร',en:'What to watch for while waiting'},body:{
th:`ระหว่างอยู่ในรายชื่อรอ ทีมจะติดตามอาการของคุณอย่างต่อเนื่องและนัดตรวจทุก 6–8 สัปดาห์ เพื่อให้คุณพร้อมผ่าตัดเมื่อได้รับอวัยวะ
## ภาวะแทรกซ้อนของโรคตับที่ทีมเฝ้าระวัง
- ท้องโตขึ้น บวม หรือน้ำหนักขึ้นเร็ว อาจเป็นท้องมาน
- อาเจียนเป็นเลือดหรือถ่ายดำ อาจเป็นเลือดออกจากเส้นเลือดขอด **ให้ไปห้องฉุกเฉินหรือโทร 1669 ทันที**
- สับสน ง่วงซึม หรือพฤติกรรมเปลี่ยน อาจเป็นภาวะสมองจากโรคตับ
- มีไข้ร่วมกับปวดท้อง อาจเป็นการติดเชื้อในช่องท้อง
- ปัสสาวะออกน้อยลง อาจเป็นภาวะแทรกซ้อนที่ไต
ใช้เมนู “บันทึกสุขภาพ” เพื่อประเมินอาการและบันทึกไว้ให้ทีมเห็น แต่ถ้าอาการรุนแรง อย่ารอการติดต่อกลับผ่านแอป
## สิ่งที่ทำได้ทุกวัน
- มาตามนัดทุกครั้ง และรับประทานยาตามที่แพทย์สั่งอย่างสม่ำเสมอ
- บันทึกน้ำหนัก ความดัน และอาการเป็นประจำ
- ดูแลความสามารถในการทำกิจวัตรประจำวัน เช่น เดิน อาบน้ำ แต่งตัวเอง และบอกทีมเมื่อทำได้น้อยลง
- งดสุรา บุหรี่ และสารเสพติด
- กินอาหารและออกกำลังกายตามคำแนะนำของนักโภชนากรและนักกายภาพบำบัด`,
en:`While you are on the waiting list, the team follows you closely with check-ups every 6–8 weeks, so you are ready when an organ becomes available.
## Liver complications the team watches for
- A growing belly, swelling or fast weight gain may be ascites
- Vomiting blood or black stools may be bleeding from varices: **go to the emergency department or call 1669 now**
- Confusion, drowsiness or changed behaviour may be liver-related brain changes
- Fever with belly pain may be an infection in the abdomen
- Passing less urine may be a kidney complication
Use “Health log” to check and record symptoms for the team, but if symptoms are severe, don’t wait for a reply through the app.
## Every day
- Keep every appointment and take your medicines as prescribed
- Record your weight, blood pressure and symptoms regularly
- Notice how well you manage daily tasks such as walking, bathing and dressing, and tell the team if this gets harder
- No alcohol, smoking or drugs
- Eat and exercise as your dietitian and physiotherapist advise`}},

/* minimal markup: ## heading, - bullet, 1. step, **bold** */
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function md(s){let h='',list=null;const close=()=>{if(list){h+=`</${list}>`;list=null}};
 for(let l of String(s||'').split('\n')){l=l.trim();if(!l){close();continue}
  let m;if(l.startsWith('## ')){close();h+=`<h3>${inl(l.slice(3))}</h3>`}
  else if(l.startsWith('- ')){if(list!=='ul'){close();h+='<ul>';list='ul'}h+=`<li>${inl(l.slice(2))}</li>`}
  else if(m=l.match(/^\d+\.\s+(.*)/)){if(list!=='ol'){close();h+='<ol>';list='ol'}h+=`<li>${inl(m[1])}</li>`}
  else{close();h+=`<p>${inl(l)}</p>`}}
 close();return h}
const FEEL=[['good','ดี','Good'],['fair','พอใช้','Fair'],['poor','ไม่ค่อยดี','Not good']];

const activeRx=pid=>D.prescriptions.find(r=>r.patientId===pid&&r.status==='active');
function lastLog(pid,itemId,date,time){let r=null;for(const l of D.medLogs)if(l.patientId===pid&&l.itemId===itemId&&l.date===date&&l.time===time)r=l;return r}
function slotsOn(pid,date){const rx=activeRx(pid);if(!rx)return[];const out=[];rx.items.forEach(it=>{if(it.start&&it.start>date)return;if(it.end&&it.end<date)return;it.times.forEach(tm=>out.push({rx,item:it,time:tm,date,log:lastLog(pid,it.id,date,tm)}))});return out.sort((a,b)=>a.time.localeCompare(b.time))}
function adherence(pid,days=7){let tot=0,ok=0;const now=nowHM();for(let k=days-1;k>=0;k--){const d=dOff(-k);slotsOn(pid,d).forEach(s=>{if(k===0&&s.time>now&&!s.log)return;tot++;if(s.log?.status==='taken')ok++})}return tot?Math.round(ok/tot*100):null}
function dayStatus(pid,d){const s=slotsOn(pid,d);if(!s.length)return'none';const t=s.filter(x=>x.log?.status==='taken').length;const bad=s.some(x=>x.log&&x.log.status!=='taken');if(t===s.length)return'full';if(bad)return'partial';if(d===todayISO)return'today';return t?'partial':'empty'}

function flagOf(l){if(l.refLow==null&&l.refHigh==null)return'none';if(l.refLow!=null&&l.value<l.refLow)return'L';if(l.refHigh!=null&&l.value>l.refHigh)return'H';return'N'}
const refText=l=>l.refLow!=null&&l.refHigh!=null?`${l.refLow}–${l.refHigh}`:l.refLow!=null?`≥ ${l.refLow}`:l.refHigh!=null?`≤ ${l.refHigh}`:'—';

function spark(vals,w=160,h=34){if(vals.length<2)return'';const min=Math.min(...vals),max=Math.max(...vals),r=max-min||1;const pts=vals.map((v,i)=>[i*(w-8)/(vals.length-1)+4,h-4-(v-min)/r*(h-10)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const last=pts[pts.length-1];return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="spark-a" d="${d} L${last[0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h}Z"/><path class="spark-l" d="${d}"/><circle class="spark-d" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3"/></svg>`}
function byChip(id){const r=roleOf(id);return r==='caregiver'?chip('info',icon('users')+_('ญาติบันทึก','By caregiver')):r==='staff'?chip('brand',_('บุคลากรบันทึก','By staff')):chip('',_('ผู้ป่วยบันทึก','By patient'))}

function doseGroups(pid,slots,rec){const times=[...new Set(slots.map(x=>x.time))];const now=nowHM();
 const firstOpen=times.find(t=>slots.some(x=>x.time===t&&!x.log));
 return `<div class="dgroups">${times.map(t=>{const g=slots.filter(x=>x.time===t),done=g.filter(x=>x.log?.status==='taken').length,anyBad=g.some(x=>x.log&&x.log.status!=='taken'),open=g.filter(x=>!x.log).length;
  const st=open===0?(anyBad?chip('warn',_('บันทึกแล้ว มีมื้อที่ไม่ได้รับประทาน','Recorded, some not taken')):chip('ok',icon('check')+_('ครบแล้ว','All taken'))):t<now?chip('warn',_(`เลยเวลา · ค้าง ${open}`,`Past due · ${open} left`)):chip('',_(`รอ ${open} รายการ`,`${open} to take`));
  const id='dose-'+todayISO+'-'+t;const isOpen=S.folds[id]??(t===firstOpen);
  return `<details class="dgroup" data-fold="${id}" ${isOpen?'open':''}><summary><span class="time">${t}</span><span class="dg-n">${g.map(x=>esc(x.item.name)).join(', ')}</span>${st}<span class="fold-i">${icon('down')}</span></summary><ul class="doses">${g.map(x=>doseRow(pid,x,rec)).join('')}</ul></details>`}).join('')}</div>`}
function doseRow(pid,s,rec){
 const key=`${s.item.id}|${s.date}|${s.time}`,st=s.log?.status,editing=S.doseEdit===key;
 const due=!st&&s.date===todayISO&&s.time<nowHM();
 const btns=`<button class="btn sm ok" data-a="dose" data-pid="${pid}" data-item="${s.item.id}" data-rx="${s.rx.id}" data-date="${s.date}" data-time="${s.time}" data-st="taken">${icon('check')} ${_('รับประทานแล้ว','Taken')}</button><button class="btn sm" data-a="dose" data-pid="${pid}" data-item="${s.item.id}" data-rx="${s.rx.id}" data-date="${s.date}" data-time="${s.time}" data-st="missed">${_('ลืม','Missed')}</button><button class="btn sm" data-a="dose" data-pid="${pid}" data-item="${s.item.id}" data-rx="${s.rx.id}" data-date="${s.date}" data-time="${s.time}" data-st="unable">${_('รับประทานไม่ได้','Couldn’t take')}</button>`;
 let act;
 if(st&&!editing)act=`${doseChip(st)}${roleOf(s.log.by)!=='patient'?byChip(s.log.by):''}${rec?`<button class="btn sm ghost" data-a="doseedit" data-k="${key}">${_('เปลี่ยน','Change')}</button>`:''}`;
 else act=rec?btns:(due?chip('warn',_('เลยเวลา ยังไม่บันทึก','Overdue, not recorded')):chip('',_('ยังไม่บันทึก','Not recorded')));
 return `<li class="dose"><span class="time">${s.time}</span><div class="dose-info"><b>${esc(s.item.name)}</b><span>${esc(L(s.item.dose))}${s.item.form?' · '+esc(L(s.item.form)):''}</span>${s.item.note?`<small>${esc(L(s.item.note))}</small>`:''}${due&&rec?`<small style="color:var(--warn);font-weight:600">${_('เลยเวลาแล้ว','Past due')}</small>`:''}</div><div class="dose-act">${act}</div></li>`;
}
function weekStrip(pid){return `<div class="week">${[6,5,4,3,2,1,0].map(k=>{const d=dOff(-k),st=dayStatus(pid,d);const inner=st==='full'?icon('check'):st==='partial'?'!':st==='today'?'·':st==='empty'?'?':'–';return `<div class="wd ${st}" title="${fmtDate(d)}"><i>${inner}</i><span>${parseISO(d).toLocaleDateString(loc(),{weekday:'short'})}</span></div>`}).join('')}</div>

function rxCard(rx,staff){

function labChip(l){const f=flagOf(l);if(f==='H')return chip('warn','↑ '+_('สูงกว่าช่วงอ้างอิง','Above range'));if(f==='L')return chip('warn','↓ '+_('ต่ำกว่าช่วงอ้างอิง','Below range'));if(f==='N')return chip('ok',_('ในช่วงอ้างอิง','In range'));return chip('',l.test==='TAC'?_('เป้าหมายตามที่ทีมกำหนด','Target set by team'):_('ไม่มีช่วงอ้างอิง','No range given'))}
function labsPanel(pid){
 const staff=S.user.role==='staff'&&canRecord(pid);const all=labsOf(pid);
 const head=`<section class="card"><div class="card-h"><div><h3>${icon('flask')} ${_('ผลตรวจทางห้องปฏิบัติการ','Laboratory results')}</h3>${all.length?`<p class="muted">${_('ตรวจล่าสุด','Latest test')} ${fmtLong(all[all.length-1].date)}</p>`:''}</div>${staff?`<button class="btn primary" data-a="labadd" data-pid="${pid}">${icon('plus')} ${_('เพิ่มผลตรวจ','Add result')}</button>`:''}</div>
 <p class="hint">${_('ช่วงอ้างอิงมาจากห้องปฏิบัติการที่ตรวจในแต่ละครั้ง ซึ่งแต่ละโรงพยาบาลอาจต่างกัน การแปลผลให้ปรึกษาทีมรักษา','Reference ranges come from the lab that ran each test and can differ between hospitals. Ask your team what the results mean for you.')}</p></section>`;
 if(!all.length)return head+emptyCard('flask',_('ยังไม่มีผลตรวจ','No results yet'));
 return head+LAB_GROUPS.map(([g,gl])=>{const tests=LABS.filter(t=>t.g===g&&labsOf(pid,t.code).length);if(!tests.length)return'';
  return `<section class="card"><h3>${esc(L(gl))}</h3><div class="tbl-wrap"><table><thead><tr><th>${_('รายการ','Test')}</th><th>${_('ผลล่าสุด','Latest')}</th><th>${_('เทียบช่วงอ้างอิง','vs range')}</th><th>${_('ช่วงอ้างอิง','Range')}</th><th>${_('วันที่','Date')}</th><th style="min-width:120px">${_('แนวโน้ม','Trend')}</th></tr></thead><tbody>${tests.map(t=>{const h=labsOf(pid,t.code),l=h[h.length-1];

}
